:"merged-mtxrntsm-8","sourceNo":92,"originalSourceNo":587,"displayNo":92,"vi":"Đấy, thấy không? Cố gắng là được đấy thôi.\nGiờ xong hết rồi chứ? Được rồi. Vừa đủ 8.900.000 won.\nCó chuyện gì vậy? Cô trúng xổ số hả?\nGiám đốc, chúng ta chưa đưa giấy vay nợ.\nGì cơ? Giấy vay nợ.\nNày, tôi bị trĩ đấy! Nó vỡ ra bây giờ.\nSao ánh mắt lại vậy chứ? Ánh mắt nào?\nĐiều này hẳn là rất kinh khủng. Đúng không?","ko":"거 봐, 이렇게 노력하니까 되잖아, 응?\n다 됐죠? 자, 890만 원 정확합니다\n어떻게 된 거야? 로또 맞았어?\n사장님, 차용증서를 안 줬는데요\n뭐? 차용증서요\n야, 나 치질 있다고! 이거 터지면 진짜 너...\n그 눈빛은 뭐지? 뭔 눈빛?\n(윤진명) 그건 진짜 끔찍할 거야. 그치?","en":"Thanks. I told you that there would be a way.\nWe're all done here, right? All right. It is $9,000.\nWhat happened? Did you win a lottery?\nBoss, you didn't give her the IOU. What? The IOU.\nHey, I have hemorrhoids! You will worsen it...\nWhat with that look in those eyes? What eyes?\nThat must be really terrible. Right?","start":2882.687288,"end":2922.813141,"viStart":2850.674756,"viEnd":2892.252987,"koStart":2882.687288,"koEnd":2922.813141,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2850.674756,"end":2892.252987},"koRange":{"start":2882.687288,"end":2922.813141}},{"id":93,"sourceUid":"merged-mtygmk3b-10","sourceNo":93,"originalSourceNo":618,"displayNo":93,"vi":"Tôi đếm đến ba. Cậu không bỏ ra là chết với tôi.\nMột, hai, ba… Không sao. Không có chuyện gì đâu.\nNếu mà có thì hẳn sẽ là chuyện lớn.\nHay mình cứ giết cậu ta luôn?\nKhông có chuyện gì đâu.\nEm chỉ muốn gặp anh để vừa uống cà phê, vừa nói chuyện giết thời gian.\nEm muốn thử làm chuyện người bình thường hay làm. Anh không phiền chứ?","ko":"야, 너 셋 셀 동안. 안 놓으면 죽는다, 진짜\n하나, 둘, 셋. 별일 아니야. 별일 아니지, 그럼\n별일이면 큰일이게?\n저걸 진짜 죽여버릴까?\n(윤진명) 별일 아니에요\n그냥 별일 없이 만나서 커피 마시고 얘기하고 시간 보내고\n그런 거 한번 해보고 싶었어요, 남들처럼\n(윤진명) 괜찮죠?","en":"Hey. I will count to three. Let me go or I'll kill you!\nOne, two, three... It's nothing. Of course it's nothing.\nIf it is something,\nit must be a serious one.\nShould I just kill her? It's nothing.\nI wanted to meet up with you and have coffee,\nand spend time talking to you.\nJust like everyone else does. That's okay, right?","start":2933.635,"end":2966.682385,"viStart":2892.252987,"viEnd":2934.518293,"koStart":2933.635,"koEnd":2966.682385,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2892.252987,"end":2934.518293},"koRange":{"start":2933.635,"end":2966.682385}},{"id":94,"sourceUid":"merged-mtygvwxy-11","sourceNo":94,"originalSourceNo":619,"displayNo":94,"vi":"Em muốn ăn kem. Anh muốn ăn gì?\nAnh cũng ăn kem. Cho tôi gọi món.\nJin Myung, thấy thế nào? Hình như không hợp lắm.\nThật hả? Vâng. Vậy em thử chọn xem. Không sao đâu. Đi thôi.\nGiờ mình làm gì nhỉ? Hay đi xem phim nhé? Phim?","ko":"난 아이스크림 먹을래요. 뭐 먹을래요?\n나도 아이스크림. (박재완) 여기 주문할게요\n진명 씨, 이거 어때요? 그건 아닌 거 같애요\n아. (윤진명) 네. 진명 씨도 하나 골라봐요\n아니에요, 가요. 우리 이제 뭐 할까요?\n영화 봐요. 그럴까요?","en":"I want ice cream. What about you?\nI'll have ice cream, too. Excuse me. We'd like to order.\nJin-Myung, how does this look on me? I don't think it suits you.\nIs that right? Yes. Jin-Myung, you pick one, too.\nNo, it's okay. Let's go. What should we do next?\nLet's go see a movie. A movie?","start":2966.682385,"end":3012.994603,"viStart":2934.518293,"viEnd":2982.369082,"koStart":2966.682385,"koEnd":3012.994603,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2934.518293,"end":2982.369082},"koRange":{"start":2966.682385,"end":3012.994603}},{"id":95,"sourceUid":"merged-mtyh2vsr-12","sourceNo":95,"originalSourceNo":630,"displayNo":95,"vi":"Em không thể mở mắt. Em ngủ thiếp đi\nNằm sâu vào bên trong đôi cánh anh. Em ngủ thiếp. Thức dậy\nEm định bay đi. Em mở mắt và nhìn anh\nEm lại ngủ thiếp đi. Đi theo đôi cánh anh","ko":"♪ 눈을 뜰 수 없어 ♪\n♪ 금새 난 잠들고 ♪\n♪ 너의 날개 속에 묻혀 ♪\n♪ 잠들고 ♪\n♪ 잠을 깨우고 ♪\n♪ 날아가려 해 ♪\n♪ 애써 눈뜨고 널 보네 ♪\n♪ 다시 잠들어 ♪\n♪ 너의 날개를 따라 ♪","en":"I cannot open my eyes. So that I fall asleep soon\nDeep inside of your wings. I fall asleep. Wake up\nAnd will fly up high\nI keep my eyes open and look at you\nI try to fall asleep again\nAnd try to fly. Following your wings","start":3012.994603,"end":3083.815465,"viStart":2982.369082,"viEnd":3058.299435,"koStart":3012.994603,"koEnd":3083.815465,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2982.369082,"end":3058.299435},"koRange":{"start":3012.994603,"end":3083.815465}},{"id":96,"sourceUid":"merged-mtyhbtc1-15","sourceNo":96,"originalSourceNo":630,"displayNo":96,"vi":"Mẹ, lại sao ạ?\n\"Lại\" là sao? Con chào mẹ kiểu gì vậy?\nKhông có chuyện gì chứ? Không có chuyện gì.\nMẹ thấy áy náy vì không chào tạm biệt tử tế được.\nXin lỗi các chị giùm mẹ nhé!\nVâng. Đặc biệt là người trông đáng sợ,\ncái chị tên Yoon Soo Myung ấy. Yoon Soo Myung?\nCon nhớ sống hòa đồng với mọi người,\nsau này, rủ các chị tới nhà mình một lần.\nNày, Eun Jae! Con đang nghe đấy chứ?\nDạ? Con biết rồi. Con tắt đây.","ko":"어, 엄마, 왜 또?\n(유은재 엄마) 또는? 넌 무슨 인사가 그러니?\n별일 없지? (유은재 엄마) 별일은 없구\n(유은재 엄마) 인사도 제대로 못 하고 온 게 마음에 걸려서\n(유은재 엄마) 언니들한테 미안하다고 전하고\n알았어. (유은재 엄마) 특히 그 무서운 언니\n(유은재 엄마) 윤수명한테도 폐 끼쳤다고 윤수명?\n(유은재 엄마) 언니들하고 사이좋게 지내고\n(유은재 엄마) 나중에 언니들하고 집에 한번 놀러 와, 응?\n(유은재 엄마) 어머, 얘 은재야, 너 듣고 있어?\n어, 어, 알았어, 끊어","en":"Mom? What now?\n\"What now?\" What kind of greeting is that?\nIs everything okay? Yes, things are okay,\nI just felt bad that I didn't say goodbye to everyone.\nTell them that I'm sorry about that!\nOkay. Especially to that scary one, Soo-Myung Yoon. Soo-Myung Yoon? Yoon Soo Myung?\nMake sure you get along with everyone\nand bring them over to our place sometime, okay?\nHey, Eun-Jae! Are you listening?\nHuh? Yeah. Okay. Bye.","start":3083.815465,"end":3118.116,"viStart":3058.299435,"viEnd":3090.528732,"koStart":3083.815465,"koEnd":3118.116,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3058.299435,"end":3090.528732},"koRange":{"start":3083.815465,"end":3118.116}},{"id":97,"sourceUid":"merged-mtyhc44u-16","sourceNo":97,"originalSourceNo":656,"displayNo":97,"vi":"[Âm nhạc đáng ngại bắt đầu]\n[âm nhạc đáng ngại kết thúc]\n[nhạc chuông điện thoại di động rung]\n[Âm thanh điện thoại di động tắt]","ko":"[불길한 음악 시작]\n[불길한 음악 끝]\n[핸드폰 진동 벨 소리]\n[핸드폰 전원 끄는 소리]","en":"[Ominous music starts]\n[ominous music ends]\n[cellphone vibrating ringtone]\n[Sound of cell phone turning off]","start":3160.83,"end":3163.66,"viStart":3160.83,"viEnd":3163.66,"koStart":3160.83,"koEnd":3163.66,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":98,"sourceUid":"merged-mtyhjclj-17","sourceNo":98,"originalSourceNo":641,"displayNo":98,"vi":"Tiền bối Yoon! SONG JI WON\nChắc là đi bộ nhiều quá rồi.\nEm cũng muốn thử một lần. Đi bộ mà không có đích đến.\nLần sau, em cứ mang giày thể thao nhé. Lần sau… Trời cũng tối rồi.\nEm vẫn còn nhiều thứ muốn thử mà. Lần sau làm là được mà. Lần sau?","ko":"(동시에) 윤 선배!\n너무 오래 걸었나 봐요\n한번 해보고 싶었어요\n목적 없이 여기저기 걷는 거\n다음엔 운동화 신고 걸어요\n[중얼거리며] 다음?\n날이 저물어요\n해보고 싶은 게 많았는데\n다음에 하면 되죠, 천천히\n다음에요?","en":"Jin-Myung! SONG JI WON JI-WON SONG\nI guess we walked too much. I wanted to try this once.\nWalking places without a destination. Come with sneakers on next time.\nNext time... The day's almost over.\nThere were many things I wanted to try. We can do them next time. Next time?","start":3118.116,"end":3193.886993,"viStart":3090.528732,"viEnd":3167.542288,"koStart":3118.116,"koEnd":3193.886993,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3090.528732,"end":3167.542288},"koRange":{"start":3118.116,"end":3193.886993}},{"id":99,"sourceUid":"ko-mtlk8tad-1407","sourceNo":99,"originalSourceNo":666,"displayNo":99,"vi":"[Lẩm bẩm] [Tiếng máy]","ko":"[중얼거리며][기계음]","en":"[Muttering] [Machine sound]","start":3209.2,"end":3214.33,"viStart":3209.2,"viEnd":3214.33,"koStart":3209.2,"koEnd":3214.33,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":100,"sourceUid":"merged-mtyhwpob-18","sourceNo":100,"originalSourceNo":667,"displayNo":100,"vi":"Khi em cảm thấy bản thân phai mờ đi\nKhi những điều không mong muốn níu lấy\nEm muốn được anh ôm lấy\nKhông một tiếng động\nAnh ôm lấy em","ko":"♪ 쉬이 지워진다 느껴질 때 ♪\n♪ 원치 않는 마음들이 날 붙잡을 때 ♪\n♪ 안기고 싶던 ♪\n♪ 소리 없이 ♪\n♪ 감싸준 ♪","en":"When I feel like to be easily erased\nWhen unwanted minds hold me\nI want to be hugged by you\nWithout saying\nYou embraced me","start":3193.886993,"end":3223.123285,"viStart":3167.542288,"viEnd":3195,"koStart":3193.886993,"koEnd":3223.123285,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3167.542288,"end":3195},"koRange":{"start":3193.886993,"end":3223.123285}},{"id":101,"sourceUid":"ko-mtlk8tad-1418","sourceNo":101,"originalSourceNo":677,"displayNo":101,"vi":"Em chỉ sợ không có lần sau.","ko":"이건 다음에 못 할 거 같아서요","en":"I don't think I'd be able to do this next time.","start":3223.123285,"end":3225.308045,"viStart":3195,"viEnd":3199.298357,"koStart":3223.123285,"koEnd":3225.308045,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3195,"end":3199.298357},"koRange":{"start":3223.123285,"end":3225.308045}},{"id":102,"sourceUid":"en-mtlk8wzw-2154","sourceNo":102,"originalSourceNo":654,"displayNo":102,"vi":"Tình yêu của anh\nHướng về\nPhía em\nEm phải làm thế nào\nMới có thể báo đáp tấm chân tình này\nMà không làm đau trái tim anh…","ko":"♪ 나를 향한 ♪\n♪ 그대의 ♪\n♪ 그 사랑 ♪\n♪ 어떻게 하면 ♪\n♪ 이 고마운 맘 ♪","en":"Your love\nFor me\nThe love\nHow would I pass\nMy grateful heart to you\nWithout hurting your heart...","start":3225.308045,"end":3255.244415,"viStart":3199.298357,"viEnd":3227.417152,"koStart":3225.308045,"koEnd":3255.244415,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3199.298357,"end":3227.417152},"koRange":{"start":3225.308045,"end":3255.244415}},{"id":103,"sourceUid":"merged-mtyi6uci-19","sourceNo":103,"originalSourceNo":656,"displayNo":103,"vi":"Ừ. Con bé nói là có việc gấp nên phải dọn đi.\nMẹ con bé sau này sẽ đến lấy tiền cọc nhà sau.\nChị ấy không nói là vì chuyện gì sao?","ko":"(주인집 할머니) 응, 갑자기 그렇게 됐다고\n보증금은 나중에 엄마가 와서 찾아가겠다고 그러던데?\n무슨 일이라고는 안 해요?","en":"Yeah. She told me that she had to leave, all of a sudden.\nShe said that her mom would come and get the deposit later.\nShe didn't mention why she was moving out?","start":3255.244,"end":3263.92855,"viStart":3227.417152,"viEnd":3237.981862,"koStart":3255.244,"koEnd":3263.92855,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3227.417152,"end":3237.981862},"koRange":{"start":3255.244,"end":3263.92855}},{"id":104,"sourceUid":"merged-mtyi7no9-20","sourceNo":104,"originalSourceNo":681,"displayNo":104,"vi":"Em có thể gửi đến\nTấm lòng anh không","ko":"♪ 그대의 맘속에 ♪\n♪ 전할 수 ♪","en":"To your heart\nHow can I pass...","start":3263.92855,"end":3270.627507,"viStart":3237.981862,"viEnd":3241.098616,"koStart":3263.92855,"koEnd":3270.627507,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3237.981862,"end":3241.098616},"koRange":{"start":3263.92855,"end":3270.627507}},{"id":105,"sourceUid":"merged-mtyiavyq-21","sourceNo":105,"originalSourceNo":690,"displayNo":105,"vi":"TIỀN BỐI YOON Thuê bao quý khách vừa gọi hiện không liên lạc được.\nBà ấy bảo gì? Chị ấy dọn ra rồi.\nĐôi giày chị cho chị ấy… cũng biến mất rồi.\nThông minh như cô ta mà còn quên thứ này.\nMay là gặp tôi nên tôi mới đến đưa, chứ người khác thì còn lâu.\nTóm lại là chúng tôi đã đưa rồi nhé.\nAnh biết chỗ đó ở đâu không?","ko":"고객님의 전화기가 꺼져 있어 음성사서함으로 연결됩니다\n뭐래? 방 뺐대 내가 준 신발 없어졌어\n(대부업자) 똑똑한 학생이 그걸 빼먹었더라구\n(대부업자) 나나 되니까 전해주러 왔지 딴 사람 같았으면 짤 없어\n아무튼 우린 전했으니까\n거기가 어딘지 알아요?","en":"JIN-MYUNG YOON The number you are dialing is not available.\nWhat did she say? She's moving out.\nThe shoes I gave her... are gone, too.\nI thought she was smart. But she forgot this.\nI brought this for her because I am good. Nobody else would do this.\nAnyway, we brought it for her and it's all done now!\nDo you know where it is?","start":3270.877507,"end":3302.142818,"viStart":3241.098616,"viEnd":3274.356576,"koStart":3270.877507,"koEnd":3302.142818,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3241.098616,"end":3274.356576},"koRange":{"start":3270.877507,"end":3302.142818}},{"id":106,"sourceUid":"ko-mtlk8tad-1427","sourceNo":106,"originalSourceNo":686,"displayNo":106,"vi":"[chuông cửa]","ko":"[초인종]","en":"[doorbell]","start":3299.8,"end":3300.96,"viStart":3299.8,"viEnd":3300.96,"koStart":3299.8,"koEnd":3300.96,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":107,"sourceUid":"merged-mtyjcnp3-22","sourceNo":107,"originalSourceNo":691,"displayNo":107,"vi":"Nơi tiền bối Yoon… ý tôi là bệnh viện mà em trai chị ấy nằm.\nXe buýt đến rồi.","ko":"윤 선배, 그러니까 윤진명 동생이 있다는 병원\n버스 왔다","en":"The hospital where...I mean, Jin-Myung's brother is.\nThe bus is coming.","start":3302.142818,"end":3317.775227,"viStart":3274.356576,"viEnd":3290.746974,"koStart":3302.142818,"koEnd":3317.775227,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3274.356576,"end":3290.746974},"koRange":{"start":3302.142818,"end":3317.775227}},{"id":108,"sourceUid":"merged-mtyjhk1a-23","sourceNo":108,"originalSourceNo":693,"displayNo":108,"vi":"Anh nhìn em Khi thấy em cố gắng thay vì bỏ cuộc\nAnh bảo bây giờ có thể yên tâm Và ủng hộ em rồi\nAnh bảo vệ em bằng trái tim mạnh mẽ\nHơn chính cả bản thân em\nEm hát bài hát này khi nghĩ đến anh\nNgày hôm nay em cũng\nMang theo hơi ấm\nAnh đã từng trao\nEm nuốt nước mắt vào bên trong\nChịu đựng hết những buồn đau\nEm đi đây","ko":"♪ 포기할 용기보다 나아갈 용기가 커진 날 보며 ♪\n♪ 이제 조금은 안심하고 날 응원할 수 있겠다 ♪\n♪ 말해준 나보다 강한 마음으로 날 ♪\n♪ 지켜봐 줬던 ♪\n♪ 너를 생각하며 이 노랠 부른다 ♪\n♪ 나는 오늘도 ♪\n♪ 그대가 건네준 ♪\n♪ 이 온기를 신고서 ♪\n♪ 그 어떤 슬픔도 ♪\n♪ 그 어떤 눈물도 넉넉히 견뎌 걸어 ♪\n♪ 간다 ♪","en":"You saw me who was trying to go forward Instead of giving up\nYou told me that you could cheer For me with an easy mind\nI am thinking of you who kept watching me\nWith strong love for me\nI sing this song for you\nToday again\nI embrace the warmth\nThat you gave me\nI endure all the sadness\nAnd tears of my life\nI go forward","start":3317.775227,"end":3390.649331,"viStart":3290.746974,"viEnd":3362.468419,"koStart":3317.775227,"koEnd":3390.649331,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3290.746974,"end":3362.468419},"koRange":{"start":3317.775227,"end":3390.649331}},{"id":109,"sourceUid":"merged-mtyjmv3d-26","sourceNo":109,"originalSourceNo":692,"displayNo":109,"vi":"Không, không phải lỗi của mình.\nSao lại là lỗi của mình được. Con người sao đơn giản như thế.\nChị ấy sẽ không dễ dàng quyết định một việc chỉ vì một lý do.\nDù có là giọt nước làm tràn ly,\nthì cũng là do sức nặng trước đó.\nLỗi của mình chỉ tựa giọt nước đó thôi.\nSức nặng của một giọt nước.\nTrách nhiệm của một giọt nước.\nLàm ơn… Làm ơn đi mà!","ko":"(송지원) 아니야, 내 잘못이 아니야\n(송지원) 그게 어떻게 내 잘못이야 인간은 그렇게 단순하지 않아\n(송지원) 한 가지 이유로 뭔가를 결정할 리 없어, 안 그래?\n(송지원) 마지막 지푸라기가 낙타의 등을 부러뜨렸다고 해도\n(송지원) 그건 지푸라기 한 개의 무게야\n(송지원) 그 무게만큼만 잘못이 있는 거야\n(송지원) 지푸라기 하나만큼의 무게\n(송지원) 지푸라기 하나만큼의 책임\n(송지원) 제발, 제발, 제발","en":"No. It's not my fault.\nHow could it be my fault? Humans are not that simple.\nShe wouldn't have made such a decision because of a single reason. Right?\nI mean, even if it was the last straw that broke the camel's back,\nit was such a tiny thing.\nMy fault is just that much.\nThe weight of just one straw.\nThe responsibility of just one straw.\nPlease... please, please!","start":3390.649331,"end":3417.081179,"viStart":3362.468419,"viEnd":3388.717355,"koStart":3390.649331,"koEnd":3417.081179,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3362.468419,"end":3388.717355},"koRange":{"start":3390.649331,"end":3417.081179}},{"id":110,"sourceUid":"ko-mtlk8tad-1454","sourceNo":110,"originalSourceNo":713,"displayNo":110,"vi":"♪ Hãy kiên nhẫn và bước đi ♪","ko":"♪ 넉넉히 견뎌 걸어 간다 ♪","en":"♪ Be patient and walk ♪","start":3417.081179,"end":3427.210884,"viStart":3388.717355,"viEnd":3402.723248,"koStart":3417.081179,"koEnd":3427.210884,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3388.717355,"end":3402.723248},"koRange":{"start":3417.081179,"end":3427.210884}},{"id":111,"sourceUid":"merged-mtyjme9z-25","sourceNo":111,"originalSourceNo":716,"displayNo":111,"vi":"[tiếng nhạc trầm, tối bắt đầu]\n[Âm thanh máy móc 'Bíp']\n[Âm thanh dừng đột ngột] [Thông báo]","ko":"[낮고 어두운 음악 시작]\n['삐'하는 기계음]\n[급정거하는 소리][안내 방송]","en":"[low, dark music starts]\n[‘Beeping’ mechanical sound]\n[Sound of sudden stop] [Announcement]","start":3290.746974,"end":3362.490784,"viStart":3290.746974,"viEnd":3362.490784,"koStart":3290.746974,"koEnd":3362.490784,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":3290.746974,"end":3362.490784},"koRange":null},{"id":112,"sourceUid":"merged-mtzebwyn-1","sourceNo":112,"originalSourceNo":693,"displayNo":112,"vi":"Em đi đây\nChịu đựng hết những buồn đau, em đi đây","ko":"132번 코드 블루, 132번 코드 블루\n(사람들) 무슨 일이야? 어머, 세상에, 어떡해?\n(경비원) 실례합니다!\n(경비원) 비키세요, 비키세요!","en":"I go forward\nI endure all the troubles and go forward","start":3422,"end":3427.33,"viStart":3422,"viEnd":3427.33,"koStart":3422,"koEnd":3427.33,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":113,"sourceUid":"merged-mtzecyhq-2","sourceNo":113,"originalSourceNo":704,"displayNo":113,"vi":"Có chuyện gì vậy? Ôi trời ơi!\nXin lỗi!\nXin tránh đường!\nTiền bối Yoon!\nTiền bối!\nCẢNH SÁT","ko":"윤 선배!\n선배\n(송지원) 선배","en":"What's going on? Oh dear!\nLet us in!\nExcuse us!\nJin-Myung!\nPOLICE","start":3543.783215,"end":3637.46258,"viStart":3485.134995,"viEnd":3565.61826,"koStart":3543.783215,"koEnd":3637.46258,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3485.134995,"end":3565.61826},"koRange":{"start":3543.783215,"end":3637.46258}},{"id":115,"sourceUid":"merged-mtzeiqwc-4","sourceNo":115,"originalSourceNo":737,"displayNo":115,"vi":"Đức Chúa…\nCon biết Ngài muốn con mạnh mẽ hơn qua thử thách.\nCon biết Ngài chỉ đưa ra thử thách mà con có thể gánh vác được.\nCon sẽ cố gắng trở thành người tốt hơn hôm qua, ngày mai tốt hơn hôm nay.\nNgày hôm nay, xin Ngài cũng hãy bảo vệ cho gia đình con.\nCon cầu nguyện cho\nbạn cùng nhà Song Ji Won, Kang Yi Na, Yoo Eun Jae.\nĐặc biệt là tiền bối Yoon.\nGiờ chị ấy cần giúp đỡ.\nXin Ngài chỉ cho con cách có thể giúp chị ấy.\nNếu con không làm được,\nxin Ngài hãy giúp chị ấy.\nAmen!","ko":"(정예은) 주님\n(정예은) 시련을 통해 저를 강하게 만드시려는 거 알아요\n(정예은) 제가 감당할만한 시련만 주신다는 것도 알아요\n(정예은) 어제보다 오늘\n오늘보다 내일 더 좋은 사람이 되도록 노력할게요\n(정예은) 오늘 하루도 우리 가족들을 지켜주세요\n(정예은) 우리 하메들\n(정예은) 송지원, 강이나, 유은재\n(정예은) 특별히 윤 선배를 위해 기도합니다\n(정예은) 윤 선배는 지금 도움이 필요해요\n제가 어떻게 하면 윤 선배한테 도움이 될지 알려주세요\n(정예은) 제가 할 수 없다면 주님이 도와주세요\n(정예은) 아멘","en":"My Lord...\nI know that you strengthen me through trials.\nI know that you only give me trials that I can handle too.\nI'll try to become a better person every day.\nPlease protect my family today.\nI pray for my house-mates.\nJi-Won Song, Yi-Na Kang, Eun-Jae Yoo.\nEspecially, I pray for Jin-Myung.\nJin-Myung needs help right now.\nPlease let me know how I can help her.\nIf I can't be the one to help her,\nplease help her, Lord.\nAmen!","start":3637.46258,"end":3703.913408,"viStart":3607.826513,"viEnd":3675.865953,"koStart":3637.46258,"koEnd":3703.913408,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3607.826513,"end":3675.865953},"koRange":{"start":3637.46258,"end":3703.913408}},{"id":116,"sourceUid":"ko-mtlk8tae-1482","sourceNo":116,"originalSourceNo":741,"displayNo":116,"vi":"Nhạc","ko":"엄청 화가 났어","en":"Music","start":3703.913408,"end":3722.111617,"viStart":3675.865953,"viEnd":3698.333563,"koStart":3703.913408,"koEnd":3722.111617,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3675.865953,"end":3698.333563},"koRange":{"start":3703.913408,"end":3722.111617}},{"id":117,"sourceUid":"merged-mtzeqjpq-7","sourceNo":117,"originalSourceNo":725,"displayNo":117,"vi":"SAO BẠN LẠI NÓI DỐI NHƯ THẾ? Chỉ là vô tình thành vậy.\nCHUYỆN KHÁC THÌ CÒN CÓ THỂ HIỂU… Thật ra, em có thể nhìn thấy ma.\nNHƯNG CHUYỆN NÀY HƠI QUÁ ĐÁNG MÀ? Là một linh hồn bị giết. Đúng vậy.\nMỌI LỜI NÓI DỐI ĐỀU CÓ LÝ DO MÀ NHỈ? BẠN CÓ LINH CẢM KHÁ TỐT KHI NHẬN RA SỰ KHÁC THƯỜNG CỦA JIN MYUNG\nCÓ PHẢI BẠN NHẬN RA CÁC THÀNH VIÊN ĐỀU CÓ BÍ MẬT RIÊNG? Không. Thay vì là để vui…\nBẠN LÀM VẬY CHỈ ĐỂ CHO VUI THẬT SAO? Tôi cũng không biết nữa.\nTôi chỉ nói ra những gì trong đầu thôi…\nTôi thấy áp lực nếu không thể nói ra.","ko":"그냥 어쩌다 보니까…\n나 사실은\n귀신 본다, 분노\n엄청 화가 났어\n살해당한 영혼이야\n그러게요\n그쵸\n아니요\n아, 재미라기 보다는\n아, 나도 모르겠어요\n아, 그냥 그 순간에 그 말이 떠올랐고\n그 말을 하지 않으면 안 될 것 같은 압박이...\n저한테요? 아니요 그런 거 없는데요","en":"WHY DID YOU TELL SUCH A LIE? It just... kind of happened. \nLET'S SAY THAT WE CAN LET THIS SLIDE. As a matter of fact, I can see ghosts. \nBUT WASN'T THIS GOING TOO FAR? It's the soul of someone who was murdered. Yes, I know. \nISN'T THERE ALWAYS A REASON WHY PEOPLE TELL LIES? Yeah. \nYOU NOTICED JIN-MYOUNG'S CONDITION. YOU'RE VERY OBSERVANT OF WHAT IS GOING ON.\nMAYBE YOU DID IT AS YOU KNEW OTHERS HAD SECRETS. No. It wasn't for fun...\nSO YOU DID IT JUST FOR FUN? Well, I do not know. Those words just came to my mind then...\nAnd I was under pressure that I had to speak them out.","start":3730.23972,"end":3779.67066,"viStart":3698.333563,"viEnd":3743.365409,"koStart":3730.23972,"koEnd":3779.67066,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3698.333563,"end":3743.365409},"koRange":{"start":3730.23972,"end":3779.67066}},{"id":118,"sourceUid":"merged-mtzez7db-10","sourceNo":118,"originalSourceNo":739,"displayNo":118,"vi":"KHÔNG BIẾT BẢN THÂN BẠN CÓ BÍ MẬT NÀO KHÔNG? Tôi á? Không, tôi không có thứ như thế.\nTiếng gì vậy? Phụ trách âm thanh?\nChờ một lát ạ. Chúng tôi đang kiểm tra.\nHyo Jin?\nBẠN VỪA NÓI GÌ VẬY? Không. Tôi đâu có nói gì.","ko":"(제작진) 이게 무슨 소리냐?\n(제작진) 어디요?\n(제작진) 잠깐만 확인 중입니다\n효진이?\n네?\n아니요\n아무 말도 안 했는데요","en":"DO YOU ALSO HAPPEN TO HAVE SECRETS? Me? No. I do not have such things.\nWhat is this sound? Audio tech?\nWait a moment. We are checking.\nHyo Jin?\nHyou-Jin?\nDID YOU SAY SOMETHING?\nNo. I didn't say anything.","start":3779.67066,"end":3819.078821,"viStart":3743.365409,"viEnd":3783.74491,"koStart":3779.67066,"koEnd":3819.078821,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3743.365409,"end":3783.74491},"koRange":{"start":3779.67066,"end":3819.078821}},{"id":119,"sourceUid":"merged-mtzeypdy-9","sourceNo":119,"originalSourceNo":759,"displayNo":119,"vi":"['âm thanh của thắt lưng'] \n[phần đầu của nhạc chủ đề]\n[Kết thúc nhạc chủ đề]","ko":"['띠'하는 소리] \n[테마 음악 시작 부분]\n[테마 음악 끝 부분]","en":"['sound of belt'] \n[beginning of theme music]\n[End of theme music]","start":3779.67066,"end":3817.596196,"viStart":3783.74491,"viEnd":3829.843536,"koStart":3779.67066,"koEnd":3817.596196,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3783.74491,"end":3829.843536},"koRange":{"start":3779.67066,"end":3817.596196}}],"diagnostics":{"rowsCount":2399,"finalRowsCount":120,"fallbackRowsCount":120,"matchingItemsCount":116},"exportedAt":"2026-09-14T02:17:03.834Z"};

function rowsFromAnyJson(p){

function loadGameProject(p,silent=false){

function audioEl(lang){return lang==='ko'?$('koAudio'):$('viAudio')}
function normFolderPath(folder){
  folder=String(folder||'../audio').trim();

  return folder||'../audio';
}
function isAbsUrl(s){

}
function audioPath(lang){
  const file=lang==='ko'?(project.koAudioFile||''):(project.viAudioFile||'');
  if(!file)return '';
  if(isAbsUrl(file))return file;
  const folder=normFolderPath(project.audioFolder||'../audio');

function autoLoadGithubAudio(){
  const vi=audioPath('vi'), ko=audioPath('ko');
  if(vi){$('viAudio').src=vi;try{$('viAudio').load()}catch(e){}}
  if(ko){$('koAudio').src=ko;try{$('koAudio').load()}catch(e){}}

function clampVol(v){v=Number(v);if(!Number.isFinite(v))v=100;return Math.max(0,Math.min(200,v))}
function loadVolSettings(){try{return JSON.parse(localStorage.getItem(VOL_KEY)||'{}')||{}}catch(e){return {}}}
function saveVolSettings(){try{localStorage.setItem(VOL_KEY,JSON.stringify({vi:clampVol($('viVol')?.value||100),ko:clampVol($('koVol')?.value||100)}))}catch(e){}}
function volValue(lang){return clampVol($(lang+'Vol')?.value||100)}
function ensureVolGain(lang){
  try{
    const a=audioEl(lang);
    if(!volCtx)volCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(!volSources[lang]){
      volSources[lang]=volCtx.createMediaElementSource(a);
      volGains[lang]=volCtx.createGain();
      volSources[lang].connect(volGains[lang]);
      volGains[lang].connect(volCtx.destination);
    }
    if(volCtx.state==='suspended')volCtx.resume().catch(()=>{});

  }catch(e){return false}
}
function applyGameVolume(lang){
  if(lang!=='vi'&&lang!=='ko')return;
  const v=volValue(lang), a=audioEl(lang), label=$(lang+'VolLabel');
  if(label)label.textContent=Math.round(v)+'%';
  const ok=ensureVolGain(lang);
  if(ok&&volGains[lang]){a.volume=1;volGains[lang].gain.value=v/100}

function setGameVolume(lang,v,persist=true){
  const slider=$(lang+'Vol');if(slider)slider.value=String(clampVol(v));
  applyGameVolume(lang);
  if(persist)saveVolSettings();
}
function initVolumeControls(){
  const saved=loadVolSettings();
  ['vi','ko'].forEach(lang=>{
    const slider=$(lang+'Vol');
    const val=clampVol(saved[lang]??100);
    if(slider){
      slider.value=String(val);
      slider.oninput=()=>setGameVolume(lang,slider.value,true);
      slider.onchange=()=>setGameVolume(lang,slider.value,true);

  });

function validRange(s,e){s=Number(s);e=Number(e);return Number.isFinite(s)&&Number.isFinite(e)&&e>=s}
function audioRange(item,side){
  if(!item)return {lang:'readko',start:0,end:0,label:'Read KO'};
  const lang=item[side+'Lang'];
  const hasKo=!!item.hasKoAudio&&validRange(item.koStart,item.koEnd);
  const hasVi=!!item.hasViAudio&&validRange(item.viStart,item.viEnd);
  if(lang==='readko')return {lang:'readko',start:item.koStart,end:item.koEnd,label:'Read KO'};

  }

}
function koTextForRead(s){return clean(String(s||'').replace(/[()\[\]{}<>]/g,' ').replace(/^[A-Za-z0-9_.\- ]+:\s*/gm,' ').replace(/\s{2,}/g,' '))}

function rowsByKo(){return state.rows.slice().sort((a,b)=>(a.koStart-b.koStart)||(a.viStart-b.viStart)||(a.id-b.id))}
function findStartIndex(ordered){const n=Math.max(1,parseInt($('startCue').value||1,10)||1);const mode=$('startMode').value||'order';if(mode==='cue'){const idx=ordered.findIndex(r=>Number(r.sourceNo)===n||Number(r.id)===n);return idx>=0?idx:Math.min(n-1,ordered.length-1)}return Math.min(n-1,ordered.length-1)}

function answerTextForMode(r,mode){if(mode==='audio_viko')return 'VI: '+clean(r.vi)+'\nKO: '+clean(r.ko);if(mode==='audio_koen')return 'KO: '+clean(r.ko)+(r.en?'\nEN: '+clean(r.en):'');if((mode==='readko_vien'||mode==='ko_vien')&&r.en)return clean(r.vi)+'\nEN: '+clean(r.en);return clean(r.vi)}

function newRound(){

function render(){renderList('left');renderList('right');$('leftCount').textContent=state.left.length;$('rightCount').textContent=state.right.length}
function renderList(side){
  const el=$(side==='left'?'leftList':'rightList'),arr=side==='left'?state.left:state.right,sel=side==='left'?state.leftSel:state.rightSel;el.innerHTML='';
  arr.forEach((it,idx)=>{const rg=audioRange(it,side),div=document.createElement('div'),isMatched=state.matched.has(it.id);const audioOnly=side==='left'&&it.audioOnlyLeft;div.className='item '+(idx===sel?'selected ':'')+(isMatched?'good dim ':'')+(!audioOnly&&isKo(it[side])?'ko':'');const mainText=audioOnly?'<span class="audioBadge '+rg.lang+'">Audio cue</span>':esc(clean(it[side]));div.innerHTML=(side==='left'?'<span class="num">'+String(idx+1).padStart(2,'0')+'.</span>':'')+mainText+'<div class="meta">'+fmt(rg.start)+' → '+fmt(rg.end)+' · <span class="audioBadge '+rg.lang+'">'+rg.label+'</span></div>';const btn=document.createElement('button');btn.className='listenBtn '+rg.lang;btn.type='button';btn.textContent=rg.lang==='readko'?'Read KO':'Nghe';btn.onclick=(ev)=>{ev.stopPropagation();playSegment(it,side)};const meta=div.querySelector('.meta');if(meta)meta.appendChild(btn);div.onclick=()=>{if(side==='left')state.leftSel=idx;else state.rightSel=idx;render()};el.appendChild(div)})

function selected(side){const idx=side==='left'?state.leftSel:state.rightSel;if(idx===null||idx===undefined)return null;return side==='left'?state.left[idx]:state.right[idx]}

function playSegment(item,side){if(!item)return setStatus('Bạn chưa chọn câu.');const rg=audioRange(item,side);if(rg.lang==='readko'){readKoText(item.ko,side==='left'?'Read KO bên trái':'Read KO bên phải');return}const a=audioEl(rg.lang);if(!a.src){if(item.ko)return readKoText(item.ko,'Không có audio, chuyển sang Read KO');return setStatus('Bạn chưa nạp audio '+rg.label+'.')}stopAudio();applyGameVolume(rg.lang);const off=parseFloat($('offset').value||0)||0;state.audioMode='segment';state.segmentEnd=Math.max(0,rg.end+off);a.currentTime=Math.max(0,rg.start+off+0.01);a.play().catch(()=>setStatus('Cần bấm Play trên audio một lần.'));setStatus('Đang nghe '+(side==='left'?'trái':'phải')+': '+fmt(rg.start)+' → '+fmt(rg.end)+' · '+rg.label)}
function playAudioRangePromise(rg){return new Promise(resolve=>{const a=audioEl(rg.lang);if(!a||!a.src){resolve();return}const off=parseFloat($('offset').value||0)||0;const end=Math.max(0,rg.end+off);let done=false;const cleanup=()=>{if(done)return;done=true;clearInterval(timer);resolve()};const timer=setInterval(()=>{if(state.audioMode!=='roundseq'){cleanup();return}if(a.currentTime>=end){a.pause();cleanup()}},80);applyGameVolume(rg.lang);a.currentTime=Math.max(0,rg.start+off+0.01);a.play().catch(()=>cleanup())})}
async function playRound(){if(!state.left.length)return;const side='left', items=state.left.map(x=>({...x,_rg:audioRange(x,side)})).sort((a,b)=>a._rg.start-b._rg.start);stopAudio();state.audioMode='roundseq';setStatus('Đang nghe/Read KO cả lượt: '+items.length+' câu.');for(const it of items){if(state.audioMode!=='roundseq')break;const rg=audioRange(it,side);setStatus((rg.lang==='readko'?'Read KO':'Nghe')+' cả lượt: '+(items.indexOf(it)+1)+'/'+items.length+' · '+rg.label);if(rg.lang==='readko'){await readKoPromise(it.ko)}else{await playAudioRangePromise(rg)}await new Promise(r=>setTimeout(r,180))}if(state.audioMode==='roundseq'){state.audioMode='free';setStatus('Đã nghe/Read KO xong cả lượt.')}}
