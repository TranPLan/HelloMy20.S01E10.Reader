<script>
let project = {"version":"MATCHING_GAME_PROJECT_V1","source":"Subtitle Dub VI + KO Live Cut Studio V4.9.103","title":"HelloMy20 S01E10","movieTitle":"HelloMy20","episodeTitle":"S01E10","audioFolder":"../audio","viAudioFile":"hellomy20_s01e10_VI_Dub.mp3","koAudioFile":"hellomy20_s01e10_KO_Live.mp3","items":[{"id":1,"sourceUid":"merged-mtlkdsjh-2242","sourceNo":1,"originalSourceNo":2,"displayNo":1,"vi":"NỘI QUY CỦA BELLE EPOQUE\nCẤM ĐƯA ĐÀN ÔNG VÀO NHÀ","ko":"[메인 주제 음악 시작]\n[심각하게] \n[토스터기 톡 소리]","en":"","start":0,"end":52.64254,"viStart":0,"viEnd":52.64254,"koStart":0,"koEnd":52.64254,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":0,"end":52.64254}},{"id":2,"sourceUid":"merged-mtlkm8j4-2245","sourceNo":2,"originalSourceNo":8,"displayNo":2,"vi":"Thật ra, tôi… có thể nhìn thấy ma.\nĐừng có nói linh tinh nữa.\nPhỏng vấn biện bác bài báo tháng trước đâu?\nThật á? Bảo sao vai tớ nặng quá.\nChị xem chỉ tay không? Nói vớ va vớ vẩn.","ko":"사실은 나...귀신 본다. (편집장) 헛소리 그만하고\n지난달 기사 반박 인터뷰\n그래? 야, 내가 어쩐지 요즘 어깨가 너무 아파. \n손금도 봐요? 똥 싸고 앉았네","en":"As a matter of fact... I can see ghosts.\nDon't talk rubbish. Where is refuter interview from last month's article?\nReally? I felt something on my shoulders.\nDo you read palms, too? That's bullshit.","start":52.64254,"end":70.240816,"viStart":12.540237,"viEnd":29.580894,"koStart":52.64254,"koEnd":70.240816,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":12.540237,"end":29.580894},"koRange":{"start":52.64254,"end":70.240816}},{"id":3,"sourceUid":"merged-mtlkw26m-2246","sourceNo":3,"originalSourceNo":18,"displayNo":3,"vi":"Thế này mới đúng. Có một con đằng kia nữa.\nCó từ bao giờ nhỉ? Sắp xếp ngày phỏng vấn trưởng khoa chưa?\nCon trai hả? Đẹp trai không?\nHỏi số xổ số đi! Thế này mới đúng chứ.\nSao mấy người ở nhà lại vậy? Các linh hồn có màu không?","ko":"이거거든. 어, 저기도 하나 있네\n언제부터 있었지? 학장 인터뷰 날짜 잡혔어? 남자야? (박해나) 잘생겼어?\n로또 번호 좀 물어봐요. 에효. 이거잖아\n근데 왜 니들은? 영혼에게도 색깔이 있어요?","en":"That is what I expected. Oh, there's one, too.\nSince when has it been there? Have you scheduled the interview with the dean?\nDean's a guy? Is he good-looking?\nGet winning lottery numbers! That's the correct response.\nWhat's wrong with you, girls? Do spirits have colors, too?","start":70.241,"end":91.111,"viStart":29.580894,"viEnd":51.397,"koStart":70.241,"koEnd":91.111,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":29.580894,"end":51.397},"koRange":{"start":70.241,"end":91.111}},{"id":4,"sourceUid":"ko-mtlk8tab-755","sourceNo":4,"originalSourceNo":14,"displayNo":4,"vi":"[bỏ qua]","ko":"[무시하며]","en":"[ignoring]","start":78.06,"end":80,"viStart":78.06,"viEnd":80,"koStart":78.06,"koEnd":80,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":5,"sourceUid":"merged-mtll4b1x-2247","sourceNo":5,"originalSourceNo":27,"displayNo":5,"vi":"Không phải chỉ là đùa sao?\nVậy người thực vật thì sao?\nLinh hồn người thực vật ở đâu?\nChuyện đùa mà nghiêm túc như vậy thì rất khó xử luôn ấy.\nVậy thì chắc là người chị đã giết lúc đó.\nGì vậy? Mỗi người đều có một con ma bản thân quen biết sao?\nNó có thể là linh hồn của người sắp bị giết.\nĐến cả Quý cô Jung nữa!","ko":"그냥 재미로 묻는 거 아니었어?\n그럼 식물인간은?\n식물인간의 영혼은 어딨는데?\n농담한 걸 가지고 진지하면 대략 난감이지\n아, 그럼 그때 내가 죽인 게 맞나 보다\n뭐야? 다들 알고 지내는. 귀신 한둘쯤은 있는 거야?\n앞으로 살해당할 영혼이 미리 나타난 걸 수도 있다구\n정여사 너마저...","en":"You weren't just joking?\nWhat about brain-dead people?\nWhere are the souls of brain-dead people?\nIf your jokes are taken seriously, you will be embarrassed!\nOh... then I guess, I truly killed her that time.\nWhat? All of you have ghosts that you think may exist?\nIt could be a soul of a person that will be killed in the future.\nEven you, Ye-Een!","start":70.240816,"end":113.890964,"viStart":51.397,"viEnd":72.585021,"koStart":70.240816,"koEnd":113.890964,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":51.397,"end":72.585021},"koRange":{"start":70.240816,"end":113.890964}},{"id":6,"sourceUid":"merged-mtllfesv-2248","sourceNo":6,"originalSourceNo":37,"displayNo":6,"vi":"Ai bảo cậu nói dối cơ chứ?\nChỉ là giải trí trên bàn rượu thôi mà.\nĐùa vô thưởng vô phạt, nói dối vô hại.\nAnh đây đã bảo phải sửa cái tật đấy đi rồi cơ mà?\nChỉ là một chút hưng phấn trong chuỗi ngày nhàm chán thôi.\nCái đấy là lỗi lớn thế sao? Cái đấy là tội sao?\nỪ, tội đấy. Được thôi. Nếu đó là tội, tôi xin được nhận.\nTất cả đều là tội của tôi.","ko":"그러게 왜 거짓말은 해가지고...\n술자리 여흥이었다구\n무해한 농담, 백색 거짓...\n말. 그러게 이 오빠가. 그 버릇 고치라 했냐 안 했냐?\n지루한 일상의 작은 텐션이었다니까!\n그게 그렇게 큰 잘못이야?\n그게 죄야? (간단히) 응! 그래\n그것이 죄라면 좋아. 인정하겠어. 내 죄야","en":"So why did you lie? It was entertainment while we were drinking.\nIt was a harmless joke! An innocuous lie... I told you to cure that nasty habit , didn't I?\nIt was just to bring some tension to our insipid daily lives!\nWas what I did a big mistake?\nIs that a sin? Yes, it is. All right.\nIf that's a sin, I'll admit my guilt. It's all my fault.","start":113.890964,"end":143.113913,"viStart":72.585021,"viEnd":101.561075,"koStart":113.890964,"koEnd":143.113913,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":72.585021,"end":101.561075},"koRange":{"start":113.890964,"end":143.113913}},{"id":7,"sourceUid":"ko-mtlk8tab-773","sourceNo":7,"originalSourceNo":32,"displayNo":7,"vi":"[Ù tai được gọi là ‘cung hoàng đạo’]","ko":"['띠'하는 이명]","en":"[Tinnitus called ‘zodiac sign’]","start":122.26,"end":123.7,"viStart":122.26,"viEnd":123.7,"koStart":122.26,"koEnd":123.7,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":8,"sourceUid":"merged-mtlo8adr-1","sourceNo":8,"originalSourceNo":40,"displayNo":8,"vi":"Ném đá đi! Nhổ nước bọt đi!\nChỉ những người chưa từng nói dối thôi.\nTôi nên làm thế nào đây?\nSao cậu lại lo lắng?\nKhông phải bảo chỉ là giải trí trên bàn rượu thôi sao?\nĐừng có giả vờ dễ thương nữa.","ko":"돌을 던져 침을 뱉으라구!\n한 번도 거짓말한 적 없는 사람만 뱉어!\n나 어떡하냐?\n뭐가 걱정인데?\n술자리 여흥이었다며 백색 거짓말!\n귀여운 척하지 마, 좀!","en":"Cast stones at me! Spit on me!\nOnly those who have never lied can spit on me.\nWhat do I do?\nWhat are you worried about?\nYou said it was just entertainment. An innocuous lie.\nStop pretending to be cute.","start":143.113913,"end":166.336,"viStart":101.561075,"viEnd":123.698942,"koStart":143.113913,"koEnd":166.336,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":101.561075,"end":123.698942},"koRange":{"start":143.113913,"end":166.336}},{"id":9,"sourceUid":"ko-mtlk8tab-782","sourceNo":9,"originalSourceNo":41,"displayNo":9,"vi":"[tăng đờm]","ko":"[가래를 돋군다]","en":"[raises phlegm]","start":166.336,"end":201.634272,"viStart":166.336,"viEnd":201.634272,"koStart":166.336,"koEnd":201.634272,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":166.336,"end":201.634272}},{"id":10,"sourceUid":"merged-mtloacg2-2","sourceNo":10,"originalSourceNo":47,"displayNo":10,"vi":"TẬP 10-CHÚNG TA TIN BỞI VÌ CHÚNG TA MUỐN-LỜI NÓI DỐI\nLỜI NÓI DỐI NHỎ THÀNH VẤN ĐỀ TO\nĐó là cách nó đã xảy ra\n♪ Đó là lời nói dối ♪\n♪ Đó là một lời nói dối, đó là một lời nói dối Đó là một lời nói dối, đó là một lời nói dối ♪","ko":"그렇게 돼버렸어\n♪ 거짓말이야 ♪\n♪ 거짓말이야, 거짓말이야 거짓말이야, 거짓말이야 ♪","en":"That's how it happened\n♪ It's a lie ♪\n♪ It's a lie, it's a lie It's a lie, it's a lie ♪","start":123.698942,"end":155.607287,"viStart":123.698942,"viEnd":155.607287,"koStart":123.698942,"koEnd":155.607287,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":123.698942,"end":155.607287},"koRange":null},{"id":11,"sourceUid":"merged-mto3hz42-5","sourceNo":11,"originalSourceNo":57,"displayNo":11,"vi":"Nên tự thú bây giờ không? Vậy là đỡ nhất nhỉ.\nEm xin lỗi! Em đã nói dối! Em đã mắc tội chết.\nThật ra cũng không đến mức này.\n[Cười khúc khích]Trời, làm gì có ma. Mấy người tin à?\nMấy người đã tin thật sao?\nKhông. Cái này hơi nguy hiểm.\nHay thử mức giữa thôi?\n[Quan sát] Xin lỗi nhé, xin lỗi! Tớ chỉ đùa tí thôi.","ko":"지금이라도 자수할까? 그게 낫겠지\n죄송합니다, 거짓말이었습니다. 죽을죄를 지었습니다\n솔직히 이 정도는 아니잖아\n[껄렁껄렁하게] 에이, 귀신이 어딨어? 그걸 믿어?\n그걸 믿었어?\n아니, 요건 좀 위험하지\n중간으로 갈까?\n[비굴하게] 미안, 미안. 아이 그냥 장난 좀 친다는 게...","en":"Should I turn myself in? That'd be best, right?\nI'm sorry! It was a lie! Pardon me all to hell.\nHonestly, it wasn't that bad, was it?\n[Giggles] Hey, ghosts? Did you really believe that?\nDid you really believe that?\nNo. That might be too casual.\nWhat about somewhere in between?\n[Observantly] Hey, sorry, sorry! I was just joking around.","start":201.634272,"end":228.305292,"viStart":168.447922,"viEnd":195.464247,"koStart":201.634272,"koEnd":228.305292,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":168.447922,"end":195.464247},"koRange":{"start":201.634272,"end":228.305292}},{"id":12,"sourceUid":"merged-mto3sigt-7","sourceNo":12,"originalSourceNo":58,"displayNo":12,"vi":"Bản mặt cậu sao vậy?\nSao lúc khóc lúc cười?\nThật ra…tớ có chuyện muốn thổ lộ.\nKhông đâu, không đến mức phải chú ý đến thế.\nNghe bỏ ngoài tai đi, vừa làm việc vừa nghe.\nChờ em lát. Nhưng mà hãy hứa với tớ trước. Hứa không đánh tớ.","ko":"너 왜 그래? 기분 나쁘게\n(정예은) 웃었다, 울었다. 있잖아\n내가 고백할 게 있는데...\n아…아냐, 아냐 그렇게 주목할만한 건 아니고\n흘려 들어, 가볍게 들어 딴짓하면서 들어\n(유은재) 잠깐만요. 그 전에 약속부터 해줘\n때리지 않겠다고","en":"Why are you acting like that?\nWhy are you smiling and crying? Well...\nI have something to confess.\nOh, it's not a serious matter.\nJust listen while you're doing what you're doing.\nJust a minute. But before I tell you, promise me one thing. That... you won't hit me.","start":228.305292,"end":264.8582,"viStart":195.464247,"viEnd":233.972725,"koStart":228.305292,"koEnd":264.8582,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":195.464247,"end":233.972725},"koRange":{"start":228.305292,"end":264.8582}},{"id":13,"sourceUid":"merged-mtoir83a-2","sourceNo":13,"originalSourceNo":78,"displayNo":13,"vi":"Gì vậy? Chuyện trước đây tớ kể ấy…\nChuyện cậu kể có vài điều thôi chắc. Ôi mẹ ơi! Có trộm hả?\nSao? Chuyện gì? Vụ gì đấy? Đằng kia… Tiền bối Yoon!\nTiền bối Yoon, chị về lúc nào vậy?\nHả? Chị ốm hả?","ko":"아, 뭔데 그래? 전에 내가 얘기한 거 말이야\n니가 얘기한 게 한두 개야? 저기 있다고 한 그…\n[비명 소리] 엄마! (정예은) 도둑이야?\n(송지원) 왜? 뭔데? (강이나) 뭐야, 뭐야, 뭐야? 저기... 윤 선배!\n윤 선배, 언제 들어왔어? 어? 어디 아파?","en":"What is it? About what I told you before...\nYou better be more specific. Oh, shucks!\nIs there a thief? What? What is it? What? Over... there. Jin-Myung!\nJin-Myung, when did you get back? Huh? Are you ill?","start":264.8582,"end":299.705964,"viStart":233.972725,"viEnd":268.265073,"koStart":264.8582,"koEnd":299.705964,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":233.972725,"end":268.265073},"koRange":{"start":264.8582,"end":299.705964}},{"id":14,"sourceUid":"merged-mtoj1ufb-5","sourceNo":14,"originalSourceNo":83,"displayNo":14,"vi":"Chuyện tớ bảo có ma ở chỗ kia ấy… Mấy giờ rồi?\nHơn 10:40 tối rồi. Chị đi cẩn thận! Ừ.\nTạm biệt! Cẩn thận nhé chị! Ừ.\nHình như chị ấy ngủ nguyên ngày.\nCòn không đi học nữa. Chắc là chị ấy sốc lắm.\nChị ấy đã kỳ vọng rất nhiều… Chúc mừng chị!\nEm sẽ chúc mừng chị khi còn có thể! Chúc mừng, chúc mừng chị!","ko":"지금 몇 시야? 10시 40분 좀 넘었어요\n(유은재) 다녀오세요. 응. 갔다 와\n조심해. 응. 하루 종일 잤나 봐\n학교도 빼먹구. 윤 선배, 충격이 컸나 봐요\n기대가 컸으니까. 축하해, 축하해\n싫어, 난 축하할 거야, 축하할 수\n있을 때 계속 축하해야지, 축하해","en":"About the thing, I said over there... What time is it now?\nIt's past 10:40 p.m. See you later! Yes.\nBye! Be careful! Okay.\nLooks like she slept all day.\nShe even missed her classes.\nJin-Myung...She seems to be immensely shocked. She had high hopes, so...\nHooray! Congrats! Congrats! I'm going to congratulate you while I can! Congrats! Congrats!","start":299.705964,"end":338.892575,"viStart":268.265073,"viEnd":306.925388,"koStart":299.705964,"koEnd":338.892575,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":268.265073,"end":306.925388},"koRange":{"start":299.705964,"end":338.892575}},{"id":15,"sourceUid":"merged-mtsfoi1z-1","sourceNo":15,"originalSourceNo":94,"displayNo":15,"vi":"Đáng lẽ nên chúc ít hơn. Công ty đó là của nhà nước nhỉ?\nNếu đỗ phỏng vấn thì nửa đời sau an nhàn. Thích quá.\nLương tháng bao nhiêu? Tớ đã hưng phấn quá rồi.\nThật lòng chúc mừng chị. Không sao. Tiền bối Yoon cơ mà.\nChị ấy sẽ sớm hồi sinh. Đúng rồi. Tiền bối Yoon cơ mà.\nĐúng! Là tiền bối Yoon mà.","ko":"조금만 축하할걸\n거기 공기업이잖아\n합격하면 일단 정년 보장!\n아, 좋겠다\n연봉은 얼마야?\n너무 흥분했어\n아, 진짜 축하해요\n(송지원) 괜찮아, 윤 선배잖아\n곧 부활할 거야\n그래, 윤 선배니까\n그쵸? 윤 선배니까","en":"I should have congratulated her less. It's a public enterprise!\nIf you're hired, you get tenure. How lucky!\nHow much is your annual salary? I'm overexcited. Congratulations!\nIt's okay. She's Jin-Myung. She'll recover from it soon.\nYeah! She's Jin-Myung. That's right! She's Jin-Myung.","start":338.892575,"end":367.914536,"viStart":306.925388,"viEnd":338.106885,"koStart":338.892575,"koEnd":367.914536,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":306.925388,"end":338.106885},"koRange":{"start":338.892575,"end":367.914536}},{"id":16,"sourceUid":"merged-mtsfyc7r-2","sourceNo":16,"originalSourceNo":100,"displayNo":16,"vi":"Ôi! Chao ôi! Là thế nào vậy?\nLà thật hả? Không thể tin nổi!\nChào chị ạ. Chúc mừng em. Em cảm ơn chị.","ko":"(학생들) 대박이네, 부럽다\n(학생들) 어떻게 된 거야, 대박이야\n(학생들) 진짜 대단하다, 진짜...\n안녕하세요?\n축하해. 고마워요, 언니","en":"Wow! What happened? Since when?\nI can't believe it!\nHello. Congratulations. Thank you, Jin-Myung.","start":379.941298,"end":396.643109,"viStart":337.117134,"viEnd":372.52738,"koStart":379.941298,"koEnd":396.643109,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":337.117134,"end":372.52738},"koRange":{"start":379.941298,"end":396.643109}},{"id":18,"sourceUid":"merged-mtsgjvnv-5","sourceNo":18,"originalSourceNo":115,"displayNo":18,"vi":"Eun Jae! Cô! Một chuyến tàu là đến mà sao cháu không đến dù chỉ một lần?\nCô bảo đến ăn rồi mang chút kimchi về mà.\nVâng. Sao? Mẹ không cho cháu đến hả? Không phải ạ.\nĂn đi, nhanh nào. Cô cũng ăn đi ạ.\nNhìn cháu giống hệt bố cháu nhỉ.\nNếu còn sống, chắc bố cháu sẽ tự hào về cháu lắm.\nCháu nhớ bố chứ?\nThì cũng phải. Cháu là con gái bố cháu mà. Nhanh ăn đi! Ăn đi.","ko":"(유은재 고모) 은재야! (유은재) 고모!\n(유은재 고모) 지하철 타면 금방인데 한 번을 안 오니?\n(유은재 고모) 와서 밥도 먹고 김치도 가져가고 그러라니까\n네. 왜? 엄마가 못 가게 해? 아니요\n먹어, 얼른 먹어. 고모도 드세요\n이마는 아주 니 아빠를 그대로 뺐구나\n(유은재 고모) 니 아빠가 지금 널 보면 참 대견하다 했을 텐데\n아빠 생각나지? (유은재 고모) 그럼 생각날 테지, 딸인데\n아, 얼른 먹어, 응? 먹어, 먹어","en":"Eun-Jae! Aunt! You could have come easily by subway. Why didn't you visit even once?\nI told you to come have a meal with us. And pick up some Kimchi. Yes.\nWhy, doesn't your mom let you come?\nNo, that is not right.\nEat up. You have some too,\nAunt. You look just like your dad.\nYour dad would've been so proud of you.\nYou remember your dad, right?\nOf course you do. You're his daughter. Hurry and eat up! Eat, eat.","start":432.222861,"end":479.092339,"viStart":393.367299,"viEnd":447.797785,"koStart":432.222861,"koEnd":479.092339,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":393.367299,"end":447.797785},"koRange":{"start":432.222861,"end":479.092339}},{"id":19,"sourceUid":"merged-mtshdnqs-6","sourceNo":19,"originalSourceNo":122,"displayNo":19,"vi":"Cháu cũng đã gặp công ty bảo hiểm?\nKhông phải cô đã bảo cái chết của bố cháu có gì đó rất lạ sao?\nBố cháu lái xe đâu phải ngày một ngày hai.\nCũng không phải người hay uống rượu.\nCháu không thấy điều gì kỳ lạ sao?\nKhông phải đã xảy ra nhiều chuyện trước tai nạn sao?\nCòn xảy ra hỏa hoạn nữa.\nChỉ có mẹ cháu bị thương thôi.","ko":"너도 만났지? 그 보험회사\n내가 그렇잖아도 너희 아빠 죽은 게 늘 이상하다, 이상하다 했어\n(유은재 고모) 아니, 운전을 하루 이틀 한 사람도 아니고\n(유은재 고모) 술을 먹는 사람도 아니고\n너는 뭐 이상하다 싶은 거 없었니?\n(유은재 고모) 아, 왜 그때 너희 아빠 사고 나기 전에\n너네 집에 일이 많았잖아 불도 나고\n엄마만 다쳤잖아요","en":"Insurance guys came to see you too, right?\nI thought it was quite strange how your dad died.\nHe wasn't a beginner at driving.\nHe wasn't a heavy drinker, either.\nWasn't there anything that seemed strange to you?\nA lot of things were going on before your dad's accident.\nThere was a fire, too.\nOnly my mom got hurt then.","start":484.483288,"end":510.979796,"viStart":447.797785,"viEnd":478.889304,"koStart":484.483288,"koEnd":510.979796,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":447.797785,"end":478.889304},"koRange":{"start":484.483288,"end":510.979796}},{"id":20,"sourceUid":"merged-mtsi1fe1-7","sourceNo":20,"originalSourceNo":131,"displayNo":20,"vi":"Thì cũng đúng. Nhưng đâu được điều tra rõ ràng.\nSao biết được có chuyện gì xảy ra?\nEun Jae à… Hay là điều tra lại chuyện của bố cháu đi.\nMẹ cháu thì giả vờ như không nghe thấy. Giờ chỉ còn mỗi cháu thôi.\nSao lại bỏ thìa xuống? Nhanh ăn đi cháu!\nMau ăn đi. Trời ơi, nguội lạnh cả rồi kìa.\nThôi đi. Sao lại phải thú tội cơ chứ?","ko":"그건 그런데, 제대로 조사한 것도 아니고 무슨 일이 있었는지 어떻게 아니?\n(유은재 고모) 은재야!\n니 아빠 다시 검사해 보자\n(유은재 고모) 아, 니 엄마는 들은 척도 안 하고 어떡하니? 너밖에 더 있니?\n왜 숟가락을 놔? 얼른 먹어, 응?\n(유은재 고모) 얼른 먹어 더 먹어, 아이, 다 식었네\n됐어. 고백은 무슨. 난 뭐, 응","en":"That's true. But there was no proper investigation.\nWho knows what really happened?\nEun-Jae...Let's re-investigate your dad's case.\nYour mom is ignoring this. You're the only hope.\nWhy are you putting your spoon down? Hurry up and eat!\nHurry and eat. Eat up. Oh, no, it got cold already.\nNo bones broken! I don't need to confess.","start":510.979796,"end":543.928911,"viStart":478.889304,"viEnd":511.567803,"koStart":510.979796,"koEnd":543.928911,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":478.889304,"end":511.567803},"koRange":{"start":510.979796,"end":543.928911}},{"id":21,"sourceUid":"merged-mtskl3l4-12","sourceNo":21,"originalSourceNo":137,"displayNo":21,"vi":"Tôi chỉ nói là có ma chứ đâu nói là ai.\nHọ muốn tin nên mới tin chứ tôi có làm gì đâu nhỉ?\nThì làm gì cậu muốn đi. Ai nói gì đâu.\nSự thật được hé lộ và lời nói dối được làm rõ chỉ có trong truyện thôi.\nỞ ngoài đời đâu có vậy.\nNhững lời nói dối sẽ biến mất như dòng nước mà thôi.","ko":"귀신이 있다고만 했지 그게 누구라고도 안 했는데\n지들이 믿고 싶어서 믿은 걸 내가 뭐? 안 그래?\n너 좋을 대로 하세요 누가 뭐래요?\n아 뭐, 책에서나 모든 비밀이 밝혀지고 모든 거짓말이 들통나는 거지\n리얼 세상은 안 그래 그럴 필요도 없고\n(송지원) 아, 뭐 그냥 자연스럽게\n물이 흐르는 대로 흐르다가 흐지부지 사라지는 거짓말도 있고 그런 거지, 뭐","en":"I just said that there was a ghost. I never said what it was.\nThey just believed it because they wanted to, didn't they?\nDo whatever you want. Who cares.\nLies and secrets get revealed in fiction.\nBut it is not like that in real life!\nThere are lies that disappear like water flows.","start":543.928911,"end":562.896711,"viStart":511.567803,"viEnd":533.954754,"koStart":543.928911,"koEnd":562.896711,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":511.567803,"end":533.954754},"koRange":{"start":543.928911,"end":562.896711}},{"id":22,"sourceUid":"ko-mtlk8tac-883","sourceNo":22,"originalSourceNo":142,"displayNo":22,"vi":"[Tiếng ù tai 'bíp']","ko":"['삐'하는 이명 소리]","en":"['Beep' tinnitus sound]","start":585.76,"end":590.66,"viStart":585.76,"viEnd":590.66,"koStart":585.76,"koEnd":590.66,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":23,"sourceUid":"merged-mtskqc0n-14","sourceNo":23,"originalSourceNo":150,"displayNo":23,"vi":"Sao? Cuốn đấy thú vị hả?\nChuyện gì sẽ xảy ra vì lời nói dối nhỏ nhặt đó?\nCó người chết.\nSong! Cậu có mặt nạ mắt không? Không có.\nChị Kang, chị có mặt nạ mắt không?\nNếu có thì cho em mượn với.\nƠ! Sao vậy? Chị đang làm gì vậy?\nÀ, chị định bán chúng.\nThật hả? Tại sao? Sao lại bán?","ko":"왜? 그거 재밌어?\n사소한 거짓말 땜에 뭔 일이 생겼는데?\n사람이 죽어. 아으\n송! 아이패치 있어? 없어\n강 언니! 아이패치 있어?\n(정예은) 있으면 나 좀 빌려주라. 어!\n(정예은) 왜 이래? 뭐하는 거야?\n(강이나) 어, 팔려구. 진짜? 왜? 왜 팔어?","en":"Sao? What? Is that book fun?\nWhat happens because of that small lie?\nSomeone dies. Ji-Won! Do you have eye patches? No, I don't.\nYi-Na, do you have any eye patches?\nIf you have, would you lend me one? Wow! What is this?\nWhat are you doing? Oh, I'm going to sell them.\nReally? Why? Why are you selling them?","start":582.005159,"end":625.713463,"viStart":549.426409,"viEnd":593.93616,"koStart":582.005159,"koEnd":625.713463,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":549.426409,"end":593.93616},"koRange":{"start":582.005159,"end":625.713463}},{"id":24,"sourceUid":"merged-mtso1yak-16","sourceNo":24,"originalSourceNo":167,"displayNo":24,"vi":"Chị bán cả cái này hả? Em thích hả?\nVậy mua đi. Ơ… Chị sẽ giảm giá cho.\nBao nhiêu? Mười phần trăm giá bán?\nChị Kang, chị làm điều này vì con ma đằng kia hả?\nTự nhiên chị lại thay đổi thế này, không biết có liên quan đến con ma ở tủ giày không?\nÀ không. Không có gì. Làm tiếp việc chị đang làm đi.\nTôi muốn bán vài cái túi.","ko":"이것도 팔 거야? 맘에 들어? \n사! 에이. 하메 디씨 해줄게\n디씨 얼마? 매장의 10프로?\n강 언니, 이거 혹시 저기 저 귀신 때문이야?\n(송지원) 아니, 그러니까. 이 급작스러운 심경의 변화가\n(송지원) 저기 저. 신발장 귀신하고 연관이 있다든가...\n아니야, 아닙니다요. 하던 일 계속하세요, 예\n가방 팔러 왔는데요","en":"Are you selling this one, too? Do you like it?\nBuy it, then. Um... I'll give you a discount.\nHow much? Ten percent off the retail price?\nYi-Na, Are you doing this because of the ghost over there?\nWell, I am wondering if you are doing this... because of the ghost in the shoe closet?\nOh, never mind. Forget it.\nDon't disturb yourself.\nI'm here to sell some bags.","start":634.372782,"end":680.109858,"viStart":593.93616,"viEnd":648.051717,"koStart":634.372782,"koEnd":680.109858,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":593.93616,"end":648.051717},"koRange":{"start":634.372782,"end":680.109858}},{"id":25,"sourceUid":"merged-mtsofdfi-17","sourceNo":25,"originalSourceNo":173,"displayNo":25,"vi":"Có lẽ quý khách đang hiểu lầm.\nCửa hàng chúng tôi không phải túi nào cũng mua…\nTóm lại là mua hay không ạ?\nMua ạ. Chờ lát. Dong Joo à!\nMua cả guốc không ạ? Đôi này không được…\nTôi quên không bỏ ra. 11.690.000 won! Chà!","ko":"뭔가 오해가 있으신 모양인데요\n저희 매장에서는 아무 가방이나 사는…\n그래서 사요? 안 사요? 삽니다!\n잠깐만요. (강이나) 동주야! 구두도 사나요? (강이나) 아, 이건 안 돼\n빼놓는다는 걸 깜빡했네. 1,169만 원, 우와","en":"You might have been mistaken.\nOur store doesn't buy just any bag...\nSo, would you buy it or not?\nWe'll buy it. Just a moment. Dong-Joo!\nDo you buy shoes, too? Wait, they are not...\nI brought them by mistake. $11,000! Wow!","start":680.109858,"end":736.216202,"viStart":648.051717,"viEnd":703.802847,"koStart":680.109858,"koEnd":736.216202,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":648.051717,"end":703.802847},"koRange":{"start":680.109858,"end":736.216202}},{"id":26,"sourceUid":"merged-mtsprlys-19","sourceNo":26,"originalSourceNo":178,"displayNo":26,"vi":"Cậu định kiểm tra mấy lần nữa?\nKiểm tra cho chắc ấy mà.\nTận hưởng gió tiền này. Cậu vui đến thế hả?\nỪ. Cậu muốn ăn gì? Để tôi đãi cậu đồ ăn ngon.\nThôi đi. Tại sao? Chị người yêu muốn gặp hả? Ừ.\nVậy thì không còn cách nào. Cậu phải đi kiếm tiền chứ.","ko":"몇 번을 확인하냐?\n그사이에 이자 쳤을까 봐\n돈바람 한번 맞아볼래?\n그렇게 좋냐? 응, 뭐 먹을래? 맛있는 거 사줄게\n됐어. 왜? 누님이 만나재?\n어. 그럼 어쩔 수 없지, 돈 벌어야지","en":"Are you checking one by one? Yeah, just in case.\nShall we try money folding fan? Are you that happy?\nYeah. What do you want to eat? I'll treat you to something yummy. It's fine. Why?\nDo one of your girlfriends want to meet you?\nYeah. Oh well, then. You have to work.","start":736.216202,"end":756.945635,"viStart":703.802847,"viEnd":725.719582,"koStart":736.216202,"koEnd":756.945635,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":703.802847,"end":725.719582},"koRange":{"start":736.216202,"end":756.945635}},{"id":27,"sourceUid":"merged-mtss47au-23","sourceNo":27,"originalSourceNo":197,"displayNo":27,"vi":"Thả tôi xuống ở đằng kia đi.\nLiên lạc sau nhé. Sao?\nTôi có thể gọi cậu sao?\nĐiên mất… Cậu định cắt đứt liên lạc à?\nChị ở một mình à? [âm thanh 'ding']\nỪ. Tiền bối Yoon, lò vi sóng kêu.\nChị mang đôi này cho lần phỏng vấn sau đi.\nThật ra, đôi guốc lần trước không hợp chút nào.\nChắc do đôi guốc nên chị mới trượt đấy.","ko":"나 저기 앞 사거리에 세워줘\n연락해. 왜? 연락해도 되냐?\n미친... 그럼 연락 끊을라 그랬어?\n혼자 있어? 어 ['띵'하는 소리]\n(강이나) 윤 선배, 전자렌지. 아\n(강이나) 다음에 면접 볼 때 이거 신고 가\n내가 이런 말하는 게 좀 웃길지도 모르는데\n(강이나) 솔직히 그때 그 구두는 진짜 아니었거든\n아마 구두 때문에 떨어졌을 거야","en":"Drop me off over there. Call me.\nWhy? Sao? Is it really fine for me to call you?\nYou crazy... Were you going to cut ties with me?\nAre you home alone? ['ding' sound]\nYeah. Jin-Myung, the microwave!\nWear them for your next interview.\nHonestly speaking, your old shoes didn't look good.\nYou probably failed the interview because of your shoes.","start":756.945635,"end":842.582592,"viStart":725.719582,"viEnd":811.946884,"koStart":756.945635,"koEnd":842.582592,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":725.719582,"end":811.946884},"koRange":{"start":756.945635,"end":842.582592}},{"id":28,"sourceUid":"ko-mtlk8tac-939","sourceNo":28,"originalSourceNo":198,"displayNo":28,"vi":"[Âm nhạc êm dịu bắt đầu]","ko":"[잔잔한 음악 시작]","en":"[Calm music starts]","start":851.96,"end":853.93,"viStart":851.96,"viEnd":853.93,"koStart":851.96,"koEnd":853.93,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":29,"sourceUid":"merged-mtstblia-24","sourceNo":29,"originalSourceNo":202,"displayNo":29,"vi":"Em nói lời này có thể hơi buồn cười.\nNhưng vẫn còn nhiều buổi thi tuyển khác mà.\nLần sau sẽ suôn sẻ thôi.\nThực sự vì đôi guốc mà chị bị trượt sao?\nĐúng mà. Những thứ như thế quan trọng biết bao nhiêu.\nKhoa chị… có một cô bé đỗ vào công ty ấy.\nHoàn cảnh em ấy giống với chị.","ko":"내가 이런 말하는 게 좀 웃길지도 모르는데\n아직 취직시험 많이 남아 있잖아\n다음에 잘될 거야\n구두 때문에 떨어졌을까?\n맞다니까. 그런 게 얼마나 중요한데\n우리 과에 그 회사 합격한 애가 있어\n형편은 나랑 비슷해","en":"I know it might not be appropriate for me to say this.\nBut there are still a lot of other job opportunities left.\nI'm sure it'll work out next time.\nDid I really fail because of my shoes?\nYes, I am sure. Those things are really important.\nThere's a girl in my major...\nWho got into that company.\nHer financial situation is about the same as mine.","start":842.582592,"end":875.44069,"viStart":811.946884,"viEnd":843.697269,"koStart":842.582592,"koEnd":875.44069,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":811.946884,"end":843.697269},"koRange":{"start":842.582592,"end":875.44069}},{"id":30,"sourceUid":"merged-mttir8w9-3","sourceNo":30,"originalSourceNo":218,"displayNo":30,"vi":"Không. Còn kém may mắn hơn cả chị.\nEm ấy còn phải làm thêm chu cấp cho gia đình.\nTuy không nhớ rõ, nhưng hình như đôi guốc của em ấy không hơn gì chị.\nVậy nên rốt cuộc thì… là lỗi của chị đấy.\nKhông phải do điều kiện của bố mẹ, không phải do năng lực hay quan hệ.\nMà là chị cần nỗ lực hơn nữa.\nVấn đề là… chị không biết phải làm thế nào.\nDù thế thì hãy nhận đi. Em tặng chị để cảm ơn mà.","ko":"아니다, 나보다 더 안 좋다\n(윤진명) 걔는 알바해서 가족들 생활비 대니까\n기억은 안 나지만 걔 구두가 내 것보다 나았던 것 같진 않아\n그러니까 결국은...내 탓이야\n(윤진명) 부모의 경제력도 아니고\n(윤진명) 스펙도 아니구 빽도 아니구\n내가 조금만 더 잘하면 된다는 얘긴데\n문제는... 내가 더 어떻게 해야 하는지 모르겠다는 거야\n(강이나) 그래도 이건 받아\n(강이나) 감사의 의미로 주는 선물이니까","en":"No. Her situation is worse than mine.\nShe supports her family's living expenses, too.\nIf my memory serves me well, I don't think her shoes were better than mine.\nSo in the end... It was all my fault.\nIt wasn't her parents' financial power, or her qualifications and her connections.\nWhat I need to do is be a little bit better.\nThe problem, however, is... I don't know how I can be better.\nBut still, take these. I'm giving them to you because I'm thankful to you.","start":875.44069,"end":928.672788,"viStart":843.697269,"viEnd":898.198472,"koStart":875.44069,"koEnd":928.672788,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":843.697269,"end":898.198472},"koRange":{"start":875.44069,"end":928.672788}},{"id":31,"sourceUid":"ko-mtlk8tac-963","sourceNo":31,"originalSourceNo":222,"displayNo":31,"vi":"Em đâu có gì phải cảm ơn chị chứ.\nCó chứ. Em có lý do nên chị cứ nhận đi.","ko":"니가 나한테 감사한 게 뭐가 있는데?\n있어! 난 있으니까 받아","en":"Why would you be thankful to me?\nThere's reasons. I have my reasons, so take them.","start":928.672788,"end":936.970872,"viStart":898.198472,"viEnd":905.300786,"koStart":928.672788,"koEnd":936.970872,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":898.198472,"end":905.300786},"koRange":{"start":928.672788,"end":936.970872}},{"id":32,"sourceUid":"merged-mttjc1no-4","sourceNo":32,"originalSourceNo":220,"displayNo":32,"vi":"Tôi sai rồi. Tôi không cố ý làm vậy.\nĐịa ngục? Quan tâm mỗi tiền bối Yoon.\nEm đâu có cùng cỡ. Chỉ cần chị cho thì ắt sẽ vừa.","ko":"아휴. 잘못했어요\n일부러 그런 건 아닌데\n지옥이요? 치, 윤 선배만 챙겨주고\n너는 사이즈도 안 맞잖아\n주기만 하면 맞출 수 있는데","en":"I'm sorry. I didn't do it on purpose.\nHell? You only took care of Jin-Myung.\nThose shoes aren't even your size!\nI can make them fit, if you give them to me.","start":977.368832,"end":1002.474743,"viStart":939.127062,"viEnd":970.668468,"koStart":977.368832,"koEnd":1002.474743,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":939.127062,"end":970.668468},"koRange":{"start":977.368832,"end":1002.474743}},{"id":33,"sourceUid":"merged-mttjmk2g-5","sourceNo":33,"originalSourceNo":225,"displayNo":33,"vi":"[Tiếng đóng cửa]\n[Nhạc êm dịu kết thúc]\n[Tiếng đặt giày lên giá giày]","ko":"[방문 닫는 소리]\n[잔잔한 음악 끝]\n[신발장에 구두 놓는 소리]","en":"[Sound of door closing]\n[Calm music ends]\n[Sound of putting shoes on shoe rack]","start":968.53,"end":969.86,"viStart":968.53,"viEnd":969.86,"koStart":968.53,"koEnd":969.86,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":34,"sourceUid":"merged-mttjqd9u-7","sourceNo":34,"originalSourceNo":229,"displayNo":34,"vi":"Em vừa mơ thấy ác mộng.\nTrong mơ, em đã tới địa ngục.\nĐến giấc mơ cũng hợp với em.\nNếu tớ bị áp lực, thể nào cũng mơ đang thi đại học.\nTrong giấc mơ cũng thấy lạ, kiểu rõ ràng tớ đang học đại học rồi mà.\nNhưng vẫn phải thi.\nSinh viên mơ những thứ như vậy hả?","ko":"나 악몽 꿨어\n(송지원) 꿈에서 지옥 갔어\n꿈도 꼭 지 같은 거 꿔요\n(정예은) 난 스트레스 받으면 꼭 수능 보는 꿈 꾼다\n(정예은) 꿈속에서도 이상하다. 나 대학 왔는데 그러면서\n(정예은) 계속 시험을 보는 거야\n대학생들은 그런 꿈 꾸나?","en":"I had a terrible dream.\nIn my dream, I was sent to hell.\nSounds like just the right dream for you.\nWhen I get stressed, I always dream taking SAT.\nIn my dream, I say, \"This is weird as I was already in college!\"\nBut yet I keep taking the exam.\nIs that the kind of dream that college students have?","start":1013.216875,"end":1030.490978,"viStart":970.668468,"viEnd":998.628196,"koStart":1013.216875,"koEnd":1030.490978,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":970.668468,"end":998.628196},"koRange":{"start":1013.216875,"end":1030.490978}},{"id":35,"sourceUid":"merged-mttjvmqf-9","sourceNo":35,"originalSourceNo":240,"displayNo":35,"vi":"Nghe nói con trai hay mơ bị gọi đi quân sự lần nữa.\nEm cũng mơ thi đại học hả?\nEm mơ bị chó đuổi.\nBố! Cút đi! [Chó sủa] [Đứa trẻ khóc]\nCon sợ hả? Không sao. Không sao đâu.\nSao cái đấy lại là ác mộng?\nBố cứu em còn gì.\nCái kết có hậu mà? Đúng là thế, nhưng…","ko":"남자들은 군대 영장 다시 나오는 꿈 꾼다는데\n너도 수능 보는 꿈 꾸냐?\n저는요, 개한테 쫓기는 꿈 꿔요. 아빠! 가!\n[개 짖는 소리] [아이가 우는 소리]\n(아빠) 무서웠어? 에휴, 괜찮아, 괜찮아\n(정예은) 그게 왜 악몽이야? 아빠가 구해줬다며?\n그럼 해피엔딩이잖아. 그건 그런데요","en":"Guys say that they usually dream about getting the draft card again.\nDo you dream of taking SAT, too?\nI dream of being chased by a dog.\nDad! Get away! \n[Dog barking] [Child crying]\nWere you scared? It's okay. It's okay.\nSo why is that a bad dream?\nSince your dad rescued you.\nThat's a happy ending, isn't it? That's true, but...","start":1030.490978,"end":1065.535695,"viStart":998.628196,"viEnd":1033.707742,"koStart":1030.490978,"koEnd":1065.535695,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":998.628196,"end":1033.707742},"koRange":{"start":1030.490978,"end":1065.535695}},{"id":36,"sourceUid":"ko-mtlk8tac-983","sourceNo":36,"originalSourceNo":242,"displayNo":36,"vi":"[bowwow]","ko":"[개 짖는 소리]","en":"[bowwow]","start":1050.86,"end":1053.86,"viStart":1050.86,"viEnd":1053.86,"koStart":1050.86,"koEnd":1053.86,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":37,"sourceUid":"merged-mttkvb9y-11","sourceNo":37,"originalSourceNo":256,"displayNo":37,"vi":"Chú ý! Xin mọi người chú ý một lát.\nNhư mọi người đã biết, em là phóng viên nhóm báo trường.\nHơn nữa, châm ngôn của em là \"Im lặng là lời nói dối tệ nhất.\"\nTuy có thể nhắm mắt bỏ qua, nhưng vì một vài lý do…\nVì mục tiêu khỏe mạnh sống lâu của em…\nNói ngắn gọn thôi. Gì thế?","ko":"주목! (송지원) 여러분! 잠시 주목해 주십시오\n여러분도 아시다시피 제가 학보사 기자 아닙니까?\n게다가 제 좌우명이 침묵은 가장 나쁜 거짓말이다!\n그냥 모르는 척 지날 수도 있지만 여러 가지 정황상\n또 나의 무병장수를 위해서도...\n짧게 해. 뭔데? 음","en":"Attention! Everyone, your attention please.\nAs you are all aware of, I'm a reporter for the school newspaper.\nAlso, my motto is, \"The worst lies are told in silence.\"\nI could leave it as it is, as if nothing happened.\nConsidering my current circumstance and for my mental health...\nGive us the short version. What is it?","start":1065.535695,"end":1084.901137,"viStart":1033.707742,"viEnd":1054.871531,"koStart":1065.535695,"koEnd":1084.901137,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1033.707742,"end":1054.871531},"koRange":{"start":1065.535695,"end":1084.901137}},{"id":38,"sourceUid":"merged-mttlt4e9-12","sourceNo":38,"originalSourceNo":259,"displayNo":38,"vi":"À… Chuyện đó ấy mà… Trước đây em đã…\nTrời ạ, ai vậy chứ, đêm hôm rồi mà? Mẹ? Eun Jae à!\nMẹ có chuyện gì vậy?\nSao lại đối xử với mẹ như thế?\nNgười cùng chung chăn gối với mẹ mà lại thế.\nÔi, thật sự! Sao có thể làm thế với mẹ chứ?\nTuy không có động tay, nhưng đó chính là bạo hành!\nLà bạo lực gia đình đó! Rồi thì? Chú ấy nói sao?","ko":"저기 저거 말이야. 저번에 내가...\n아이! 누구야, 이 밤중에? (유은재) 엄마?\n은재야. 엄마, 무슨 일인데? 어떻게 나를... 한 이불 덮고 사는데\n아이, 진짜. 어떻게 나한테 그럴 수 있어?\n손만 안 댔다 뿐이지. 이건 폭행이야. 폭력이라구\n그래서? 아저씨가 뭐라 그랬는데?","en":"Um... About that. About how I--\nWho the heck is it, at this hour of night?\nMom? Eun-Jae! Mom, what's going on?\nWhat do I do now? What do I do, when we live together?\nOh my gosh! How could they do this to me?\nThey didn't lay a hand on me, but it was assault!\nFamily violence! So? What did he say?","start":1084.901137,"end":1149.146307,"viStart":1054.871531,"viEnd":1116.923957,"koStart":1084.901137,"koEnd":1149.146307,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1054.871531,"end":1116.923957},"koRange":{"start":1084.901137,"end":1149.146307}},{"id":39,"sourceUid":"ko-mtlk8tac-1008","sourceNo":39,"originalSourceNo":267,"displayNo":39,"vi":"[chuông cửa] [khóc nức nở]\n[Tiếng xì mũi] [Giọng nam]","ko":"[초인종][오열하며]\n[코 푸는 소리][남자 목소리로]","en":"[doorbell] [sobbing]\n[Sound of blowing nose] [In male voice]","start":1132.83,"end":1134.13,"viStart":1132.83,"viEnd":1134.13,"koStart":1132.83,"koEnd":1134.13,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":40,"sourceUid":"merged-mttm4c7b-13","sourceNo":40,"originalSourceNo":274,"displayNo":40,"vi":"\"Jung Hee, có phải là em có chuyện gì chưa nói với anh không?\" Sao có thể nói thế chứ? Chỉ có vậy thôi?\nCon phải nhìn khuôn mặt ông ta khi nói câu đấy.\nÔng ta nhìn mẹ với ánh mắt đầy nghi ngờ,\nnhư thể mẹ đang giấu một bí mật kinh hoàng nào đó ấy.\nÔng ta nghi ngờ mẹ là người giết chồng chứ gì nữa!\nNhìn mẹ có chỗ nào giống với người như thế chứ?","ko":"‘정희씨 혹시 나한테 말 안 한 게 있소?’\n(유은재 엄마) 그게 할 말이니?\n그게 다야? 그 말 할 때\n표정을 니가 봤어야 돼\n아니, 내가 엄청난 비밀을 갖고 있는 것처럼\n두 눈에 의심이 가득해 가지고는 나를\n나를 남편 죽인 사람으로 몰고 가는데","en":"\"Jung-Hee, is there anything that you haven't told me yet?\"\nHow could he say that to me? Was that it?\nYou should have seen his face when he said that!\nHe said that as if I had a huge secret,\nand his eyes were full of doubt!\nHe suspects that I'm someone who killed her husband!\nHow could anyone suspect me like that?","start":1149.146307,"end":1180.652702,"viStart":1116.923957,"viEnd":1153.092985,"koStart":1149.146307,"koEnd":1180.652702,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1116.923957,"end":1153.092985},"koRange":{"start":1149.146307,"end":1180.652702}},{"id":41,"sourceUid":"merged-mttmcmmx-14","sourceNo":41,"originalSourceNo":281,"displayNo":41,"vi":"Ở chỗ nào cơ chứ? Chắc chú ấy cũng không có ý thế đâu.\nChắc chú chỉ hỏi vậy thôi. Nhưng tại sao lại hỏi chứ?\nHỏi để làm gì? Sao mẹ có thể sống nổi với sự nghi ngờ ấy?\nMẹ không sống nổi. Một phút một giây mẹ cũng không thể!\nSao bác ấy còn giống trẻ con hơn Eun Jae nhỉ?\nVì tâm hồn giống trẻ con nên vậy?\nDa mẹ Eun Jae đẹp thật đấy.\nEm để ý da trong tình huống thế này sao? Mẹ em ổn chứ?","ko":"아니, 내가 어딜 봐서 그럴 사람이야, 어? 어딜 봐서?\n아저씨도 그런 뜻으로 한 말은 아닐 거야. 그냥 물어본 거지\n그냥 왜 물어봐? 뭐하러 물어봐?\n(유은재 엄마) 내가 그런 의심을 받고 어떻게 살어?\n못 살어, 난 일분 일초도 못 살어\n어째 은재보다 더 애기 같지?\n마음이 애기 같아서 그런가? 엄만 괜찮으셔?","en":"How could they? I trust he didn't mean it like that.\nHe just asked you a question.\nWhy would he ask me that? For what?\nHow could I live with him while he suspects me like that?\nI can't! I can't live like that even just for a second!\nShe seems like a child of Eun-Jae, doesn't she? Maybe because she has an innocent heart?\nEun-Jae's mom had amazing skin.\nHow could you notice such things in moment like this? Is your mom okay?","start":1180.652702,"end":1220.458305,"viStart":1153.092985,"viEnd":1188.165235,"koStart":1180.652702,"koEnd":1220.458305,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1153.092985,"end":1188.165235},"koRange":{"start":1180.652702,"end":1220.458305}},{"id":42,"sourceUid":"ko-mtlk8tac-1030","sourceNo":42,"originalSourceNo":289,"displayNo":42,"vi":"[Tiếng khóc] [Tiếng mở cửa]","ko":"[울음 소리] [방문 열리는 소리]","en":"[Sound of crying] [Sound of door opening]","start":1214.03,"end":1216,"viStart":1214.03,"viEnd":1216,"koStart":1214.03,"koEnd":1216,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":43,"sourceUid":"merged-mttmqd54-15","sourceNo":43,"originalSourceNo":292,"displayNo":43,"vi":"Chắc có bất đồng gì với bố dượng em.\nMẹ em hệt như thiếu nữ vậy.\nĐúng rồi, em đã nghĩ bác ấy giống ai đó.\nTớ? Chỗ nào? Không giống chút nào.\nMẹ Eun Jae thì sao?\nGiờ cậu đang coi thường bác ấy hả?","ko":"새 아버지랑 좀 안 좋은 일이 있었나 봐요\n엄마가 완전 소녀소녀 하던데?\n맞다, 은재 엄마가 누굴 닮았다 했거든?\n나? 어디가? 안 닮았어! 은재 엄마가 왜?\n너 지금 은재 어머니 무시하는 겁니까?","en":"Something happened between her and my stepfather.\nYour mom was just like a young girl.\nOh. I thought she reminded me of someone.\nMe? How come? She doesn't like me at all!\nWhy are you saying that?\nAre you looking down on Eun-Jae's mom?","start":1220.458305,"end":1239.766695,"viStart":1188.165235,"viEnd":1208.947094,"koStart":1220.458305,"koEnd":1239.766695,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1188.165235,"end":1208.947094},"koRange":{"start":1220.458305,"end":1239.766695}},{"id":44,"sourceUid":"merged-mttnq0zw-16","sourceNo":44,"originalSourceNo":304,"displayNo":44,"vi":"Các chị ơi… Chắc hôm nay mẹ em phải ngủ lại đây.\nỪ, thì sao? Tiền bối Yoon…\nTiền bối Yoon? Ngủ ở phòng chị?\nHai người sao ngủ cùng giường được?\nCòn ngủ thế nào nữa?\nVừa ôm nhau vừa ngủ thôi.\nChị không thoải mái với chị ấy mà.\nChị còn tặng giày cho chị ấy cơ mà. Em xin lỗi. Em xin lỗi,","ko":"(유은재) 저기...우리 엄마 오늘은 자고 가야 될 것 같은데\n응, 그런데? 윤 선배가... 윤 선배가…\n내 방에서 자라고?\n아, 둘이 어떻게 한 침대서 자? 어떻게 자긴\n만리장성 쌓으면서...아우, 나 윤 선배 불편한데\n치, 구두까지 주고받은 사이면서? 죄송해요\n아휴","en":"Well... I think my mom should stay here tonight. All right, so?\nBut Jin-Myung... What about her? You want to use my room?\nHow could you both sleep in one bed?\nWhat do you mean? All close and cozy, of course!\nI don't feel easy with Jin-Myung.\nEven though you gave her your shoes? I'm sorry. I'm sorry,","start":1239.766695,"end":1276.333345,"viStart":1208.947094,"viEnd":1243.832173,"koStart":1239.766695,"koEnd":1276.333345,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1208.947094,"end":1243.832173},"koRange":{"start":1239.766695,"end":1276.333345}},{"id":45,"sourceUid":"ko-mtlk8tac-1070","sourceNo":45,"originalSourceNo":329,"displayNo":45,"vi":"Mẹ em tự dưng đến nhà, nên chắc phải ngủ lại một đêm.\nnhưng hôm nay chị ngủ ở phòng chị Kang được không?\nĐược.","ko":"그냥 좀 앉아 있다 보니까...","en":"My mom stopped by all of a sudden, and she will spend the night here.\nbut could you sleep in Yi-Na's room tonight?\nSure.","start":1282.323588,"end":1298.813164,"viStart":1250.117964,"viEnd":1267.200155,"koStart":1282.323588,"koEnd":1298.813164,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1250.117964,"end":1267.200155},"koRange":{"start":1282.323588,"end":1298.813164}},{"id":46,"sourceUid":"ko-mtlk8tac-1072","sourceNo":46,"originalSourceNo":331,"displayNo":46,"vi":"Ôi… Mình nằm sang bên này…\nChắc không chật đâu nhỉ?","ko":"[중얼거리며] 내가 옆으로 가서... 안 좁겠지?","en":"Well... Should I be... It should be enough...","start":1369.526429,"end":1374.475182,"viStart":1290.28,"viEnd":1340.834,"koStart":1369.526429,"koEnd":1374.475182,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1290.28,"end":1340.834},"koRange":{"start":1369.526429,"end":1374.475182}},{"id":47,"sourceUid":"merged-mttwi539-20","sourceNo":47,"originalSourceNo":328,"displayNo":47,"vi":"Ôi trời, mọi người tỉnh rồi sao?\nCó tiệm hoa đã mở này! Đẹp đúng không?\nSao vậy? Chào bác ạ.\nMẹ đi vào đi. Sao chứ? Đi vào đi!\nSao? Ôi trời! Sao chị lại ngủ ở sofa?","ko":"(유은재 엄마) 어머, 벌써들 일어났어요?\n벌써 꽃집이 문 연 거 있지?\n(윤은재 엄마) 흠, 이쁘지?\n(윤은재 엄마) 왜들 그래? 응?\n안녕하세요? 엄마, 들어가. 왜? 들어가. 아, 왜? 아우, 진짜\n[퉁명스럽게] 왜 소파에서 잤어?","en":"Oh, you're all awake already?\nThe florist shop was open already! Isn't it pretty?\nWhat's the matter?\nHello. Mom, go in. Why? Go in!\nWhy? Sheesh! Why did you sleep on the couch?","start":1468.525035,"end":1488.169249,"viStart":1410.089057,"viEnd":1456.341403,"koStart":1468.525035,"koEnd":1488.169249,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1410.089057,"end":1456.341403},"koRange":{"start":1468.525035,"end":1488.169249}},{"id":48,"sourceUid":"merged-mtty6z66-21","sourceNo":48,"originalSourceNo":333,"displayNo":48,"vi":"[Âm nhạc êm dịu bắt đầu]\n[Nhạc êm dịu kết thúc]\n[Tiếng mở cửa]\n[chuông cửa]","ko":"[잔잔한 음악 시작]\n[잔잔한 음악 끝]\n[대문 열리는 소리]\n[초인종]","en":"[Calm music starts]\n[Calm music ends]\n[Sound of door opening]\n[doorbell]","start":1540.06,"end":1541.06,"viStart":1540.06,"viEnd":1541.06,"koStart":1540.06,"koEnd":1541.06,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":49,"sourceUid":"merged-mttzn4aw-22","sourceNo":49,"originalSourceNo":332,"displayNo":49,"vi":"Chị chỉ định ngồi một lát mà… Tiền bối Yoon, chị ngủ thêm đi. Ừ.\nChị vào phòng em mà ngủ. Ừ. Ai vậy? Đưa thư ạ!\nSáng nay cho bác xin lỗi. Không sao ạ.\nNghe nói cháu làm thêm đến tận sáng sớm. Chắc cháu mệt lắm nhỉ?\nCháu uống cà phê không? Mà ai là Yoon Soo Myung vậy?\nTại mới nãy có thư. Bác để ở kia kìa.","ko":"그냥 좀 앉아 있다 보니까...윤 선배, 더 자. 응\n내 방 들어가서 자든가\n(유은재 엄마) 누구세요?\n(우체부) 등깁니다! 아침엔 미안. 괜찮습니다\n새벽까지 알바하고 온다면서. 얼마나 피곤해요?\n(유은재 엄마) 커피 마실래요? 아뇨, 괜찮습니다\n음, 윤수명이 누구예요? 좀 전에 등기 왔길래\n내가 거기 받아놨는데","en":"I was going take a rest but...\nJin-Myung, get some more sleep.\nSure. Go sleep in my room, if you want. Yes.\nWho is it? You've got a registered mail! Sorry about this morning.\nIt's all right. I heard that you work until early in the morning. You must be so tired.\nWould you like some coffee? No, thanks.\nOh, who's Soon-Myung Yoon? A registered mail came a while ago. I left it over there.","start":1488.169249,"end":1580.806733,"viStart":1456.341403,"viEnd":1548.837608,"koStart":1488.169249,"koEnd":1580.806733,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1456.341403,"end":1548.837608},"koRange":{"start":1488.169249,"end":1580.806733}},{"id":50,"sourceUid":"merged-mttzzt0d-24","sourceNo":50,"originalSourceNo":334,"displayNo":50,"vi":"Sao vậy? Đến nhầm địa chỉ hả?\nKhông ạ. Là của cháu.","ko":"(유은재 엄마) 왜요? 잘못 온 거예요?\n아뇨, 제 거예요","en":"What's the matter? Isn't it for you?\nYes, it is mine.","start":1587.817617,"end":1593.425236,"viStart":1548.837608,"viEnd":1569.906814,"koStart":1587.817617,"koEnd":1593.425236,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1548.837608,"end":1569.906814},"koRange":{"start":1587.817617,"end":1593.425236}},{"id":51,"sourceUid":"merged-mtu0005g-25","sourceNo":51,"originalSourceNo":347,"displayNo":51,"vi":"[Hiệu ứng âm thanh khơi dậy sự tò mò]\n[Bài hát nhẹ nhàng và vui vẻ bắt đầu]","ko":"[궁금증을 유발하는 음향 효과]\n[부드럽고 경쾌한 노래 시작]","en":"[Sound effects that arouse curiosity]\n[Soft and cheerful song begins]","start":1569.906814,"end":1582.414525,"viStart":1569.906814,"viEnd":1582.414525,"koStart":1569.906814,"koEnd":1582.414525,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":1569.906814,"end":1582.414525},"koRange":null},{"id":52,"sourceUid":"merged-mtu0gy8d-29","sourceNo":52,"originalSourceNo":353,"displayNo":52,"vi":"Em đã bị bệnh ở đâu hả? Dạ?\nTại em không làm gì sau khi tốt nghiệp cấp ba. Vâng, em đã ốm.\nỞ đâu? Chỗ này chỗ kia. Giờ thì ổn chứ? Vâng, giờ em khỏe ạ.\nCửa hàng mở lúc 11:00 sáng, và đóng lúc 9:00 tối. Tính cả thời gian dọn dẹp cuối ngày thì đến 10:00 tối.\nThời gian cần người là từ 4:00 đến 10:00 tối. Lương giờ là 6.500 won, phải làm năm ngày một tuần.\nKhông chỉ là việc ở cửa hàng,\ncòn phải sắp xếp kho hàng, và giao hàng đi nữa. Có nhiều việc phải làm.\nDù vậy, em sẽ học hỏi được nhiều đấy. Em có gì thắc mắc không? Không ạ.\nVậy, bắt đầu làm từ tuần sau.\nEm cảm ơn ạ.","ko":"어디 아팠어요? 네? 고등학교 졸업하고 아무것도 안 했길래\n네, 좀 아팠어요. 어디가?\n그, 여기저기 좀... 지금은 괜찮죠? 네, 건강합니다\n우리 가게는 11시에 오픈해서 9시에 끝나요. 마무리하는 시간까지 하면 10시\n사람 필요한 시간은 4시부터 10시까지\n시급 6,500원 일주일에 5일 일해야 되구요.\n(옷가게 주인) 샵 일뿐만 아니라. (옷가게 주인) 재고 정리도 해야 되구\n(옷가게 주인) 택배도 보내야 되구, 잡일이 많아요\n(옷가게 주인) 뭐 궁금한 거 있어요? 아니요. 그럼 다음 주부터 출근해요. 고맙습니다\n그래도 일은 많이 배울 수 있을 거예요","en":"Were you sick for a long time? Pardon me? You didn't do anything since you graduated high school, so... Yes, I was.\nWhere? Here, there, and all over. You're fine now, aren't you? Yes. I'm healthy now.\nWe open at 11:00 a.m. and close at 9:00 p.m. Including the time to wrap up, you'll be here until 10:00 p.m.\nAnd we need you from 4:00 p.m. to 10:00 p.m. The hourly wage is $6. You'll have to work 5 days a week.\nYou will work on the floor, You'll also have to organize inventory, and send packages, too. A lot of extra work to do.\nHowever, you will get good learning experiences. Do you have any questions? No.\nThen you can start next week. Thank you.","start":1580.806733,"end":1661.585034,"viStart":1582.414525,"viEnd":1629.569793,"koStart":1580.806733,"koEnd":1661.585034,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1582.414525,"end":1629.569793},"koRange":{"start":1580.806733,"end":1661.585034}},{"id":53,"sourceUid":"merged-mtu0v9a6-31","sourceNo":53,"originalSourceNo":365,"displayNo":53,"vi":"Chỉ ngần này? Chú ơi! Mình vừa đánh mất hai tiếng lương.\nTôi có thể giúp gì? Sao tôi không qua được vậy?\nTôi có thể xem thẻ… À, thẻ tín dụng?\nCô không có thẻ giao thông ạ? Thẻ giao thông?\nDễ thương nhỉ. Cũng được. Tớ không có cảm giác lắm.\nỒ, sinh viên y dược? Gì vậy? Ban nhạc?","ko":"(강이나) 에게. 아저씨! 두 시간이나 날라 갔어\n(역무원) 도와드릴까요?\n아이, 이거 왜 저는 안 돼요?\n어, 그게... 카드 좀 잠깐...아, 카드? 신용카드요?\n혹시 교통카드 없으세요? 교통카드요?\n(정예은 친구 1) 귀엽네. (정예은 친구 2) 야, 괜찮다. (정예은) 뭔가 느낌이 좀 아냐\n(정예은 친구) 오, 의대생! (정예은 친구) 오, 뭐야? 밴드? 드럼?","en":"Only this! Sir! It was my wages for two hours.\nMay I help you? Why doesn't this work for me?\nOh, can I see your card...My credit card?\nDon't you have a transportation card? A transportation card?\nHe's cute. Yeah, he's okay. I don't know. I'm not feeling it.\nOh, a med-school student? What? He's in a band, too?","start":1661.585034,"end":1749.2,"viStart":1629.569793,"viEnd":1716.966238,"koStart":1661.585034,"koEnd":1749.2,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1629.569793,"end":1716.966238},"koRange":{"start":1661.585034,"end":1749.2}},{"id":54,"sourceUid":"en-mtlk8wzv-1863","sourceNo":54,"originalSourceNo":363,"displayNo":54,"vi":"[Tiếng 'bíp']","ko":"['삑'하는 소리]","en":"['Beep' sound]","start":1743.63,"end":1745.46,"viStart":1743.63,"viEnd":1745.46,"koStart":1743.63,"koEnd":1745.46,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":55,"sourceUid":"merged-mtu3ab1h-32","sourceNo":55,"originalSourceNo":377,"displayNo":55,"vi":"Chơi trống? Tớ không hợp với người làm nhạc.\nSao lại thế nhỉ? Tớ cũng đăng ký vậy. Ôi, cao quá!\nChà, 1,87m không phải cao quá sao?\nSao chả có người đàn ông nào được vậy?\nKhông phải không có đàn ông mà là cậu không có ý định ấy.\nNói gì vậy? Tớ muốn. Tớ sẽ hẹn hò mà.\nĐược rồi. Vậy cậu nói người đàn ông cậu muốn đi.\nMẫu người lý tưởng? À, mẫu người lý tưởng?","ko":"(정예은) 음악 하는 사람 나랑 별로 안 맞아\n(정예은 친구) 야, 여기 왜 이래? 나도 가입할까 봐\n(정예은 친구) 어, 기럭지 봐라\n아유, 187은 좀 부담이지\n아이 왜 이렇게 남자가 없냐?\n왜? 남자가 없는 게 아니라\n마음이 없는 거 아냐?\n아, 뭔 소리야. 마음 있어, 남자 만날 거야\n좋아! 그러면 니가. 원하는 남자를 말해 봐\n(정예은) 이상형! 음, 이상형?","en":"He plays the drums? I don't get along with musicians well.\nWhat's going on there? Let me sign up, too.\nWow, look how tall he is!\nI don't know. Six feet is too tall.\nWhy are there no good guys?\nIt's not that there aren't any good guys. It's that you're not into this.\nWhat are you talking about? I'm in! I'm going to meet a guy!\nFine. Let me know what kind of guy you want.\nYour ideal man! Hmm, my ideal man?","start":1749.2,"end":1782.675646,"viStart":1716.966238,"viEnd":1751.045609,"koStart":1749.2,"koEnd":1782.675646,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1716.966238,"end":1751.045609},"koRange":{"start":1749.2,"end":1782.675646}},{"id":56,"sourceUid":"merged-mtu5zhhc-34","sourceNo":56,"originalSourceNo":382,"displayNo":56,"vi":"Tớ không thích người quá cao. Tầm vừa đủ để ôm là được.\nCao hơn tớ tầm 15cm?\nVới cả, tớ thích kiểu tóc gọn gàng hơn là tóc dài.\nMắt hai mí đẹp. Mũi thì cao vừa phải.\nĐể xem nào… Ngoài ra, mắt cười không phải rất thu hút sao?\nVới cả, tớ thích người có vóc dáng như thể đang tập thể thao vậy.","ko":"키는 너무 큰 건 싫고 안겼을 때 딱 좋은 사이즈\n그러니까 나보다 15센티 정도?\n그리구 헤어스타일은 좀 긴 머리보다는 깔끔한 스타일이 좋아\n눈은 쌍꺼풀 있는 예쁜 눈이 좋구\n어, 코는 적당히 살짝 높은?\n그리구 보자. 아, 그 왜 웃을 때 이렇게 눈웃음 지어주는 거 너무 매력 있지 않아?\n(정예은) 그리구 몸매는 좀 운동한 것 같은 몸이 좋아","en":"I don't like a guy who's too tall. Someone who's the perfect size to hug.\nSo maybe six inches taller than I am?\nRegarding hairstyle, neat and short rather than long.\nI like double-lidded eyes. As for the nose... A bit sharp.\nLet's see...Eyes that turn into half-moons when he smiles!\nAs for body shape... I like a guy who looks like he works out.","start":1782.675646,"end":1811.7107,"viStart":1751.045609,"viEnd":1778.083607,"koStart":1782.675646,"koEnd":1811.7107,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1751.045609,"end":1778.083607},"koRange":{"start":1782.675646,"end":1811.7107}},{"id":57,"sourceUid":"merged-mtu66f0b-35","sourceNo":57,"originalSourceNo":390,"displayNo":57,"vi":"Như thế thì khi mặc quần áo mới đẹp được.\nKiểu vừa nhìn đã có thứ cảm giác gì đó ấy…\nCảm giác như gặp người này ở đâu đó nhiều rồi ấy.\nKhông! Không phải đâu.\nGiờ cũng đến lúc cậu quên anh ta rồi. Tớ quên rồi mà.\nNếu cậu sống vào thời Joseon, thì chắc cậu được gọi là liệt nữ mất.\nĐã bảo không phải mà!","ko":"그래야 옷 입었을 때 이렇게 옷발도 잘 받고\n그게 뭔가 딱 봤을 때 느낌적인 느낌이 그게…\n어디서 많이 본 남자 같지?\n아유, 아니야, 아니야 어, 어, 어,허어,허\n이제 잊을 때도 됐구만. 아, 잊었다니까!\n야, 너는 조선시대 태어났으면 열녀 소리 들었겠다\n아니라고 진짜","en":"So that clothes fit well on him.\nHe will make me feel good at a glance...\nHe sounds like a guy who we've seen many times.\nOh, boy! No, no!\nYou should have forgotten him by now. I did!\nYou'd be called as a single-man woman if you were born a century ago.\nNo, stop it!","start":1811.7107,"end":1837.309613,"viStart":1778.083607,"viEnd":1805.355462,"koStart":1811.7107,"koEnd":1837.309613,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1778.083607,"end":1805.355462},"koRange":{"start":1811.7107,"end":1837.309613}},{"id":58,"sourceUid":"ko-mtlk8tac-1139","sourceNo":58,"originalSourceNo":398,"displayNo":58,"vi":"[Kết thúc bản nhạc êm đềm và vui vẻ] [Cười khúc khích]","ko":"[잔잔하고 경쾌한 음악 끝][낄낄]","en":"[Calm and cheerful music ends] [Giggles]","start":1830.03,"end":1831.53,"viStart":1830.03,"viEnd":1831.53,"koStart":1830.03,"koEnd":1831.53,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":59,"sourceUid":"merged-mtu6gmeq-37","sourceNo":59,"originalSourceNo":394,"displayNo":59,"vi":"Mai ăn mỳ Ý đi.\nĐằng nào cũng ăn đồ ngấy thì ăn ban ngày vẫn tốt hơn nhỉ?\nỒ, anh à! Ừ. Đã lâu không gặp. Sao anh lại đến đây?\nÀ, anh chỉ đi qua thôi. Em chưa ăn trưa nhỉ… Thôi em đi nhé.\nBọn mình ăn mì hải sản sốt kem nhé?\nXem show ẩm thực hôm qua chưa?","ko":"(정예은) 우리 스파게티 먹자\n(정예은) 느끼한 거 먹을 거면 어차피 낮에 먹는 게 나, 그지?\n어머, 오빠! 오랜만이네, 어쩐 일이야?\n아, 뭐 그냥 지나가다가 잠깐...\n점심 안 먹었으면...그럼 볼일 봐\n(정예은) 우리 해물 크림 스파게티 먹자. 어제 수요미식회 봤어?","en":"Let's eat spaghetti tomorrow.\nIt's better to eat oily food during day time, isn't it?\nOh, Doo-Young! Hi. It's been a while. What brings you here?\nWell, I was just passing by.\nIf you didn't have lunch yet... Do your business, then.\nHow about seafood cream sauce spaghetti?\nDid you see that food channel last night?","start":1855.422051,"end":1876.830973,"viStart":1823.134419,"viEnd":1845.045985,"koStart":1855.422051,"koEnd":1876.830973,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1823.134419,"end":1845.045985},"koRange":{"start":1855.422051,"end":1876.830973}},{"id":60,"sourceUid":"merged-mtu7n2c7-41","sourceNo":60,"originalSourceNo":411,"displayNo":60,"vi":"Nó chiếu món đó. Nhìn con tôm đúng là to đùng luôn.\nNay thời tiết đẹp thật đấy! Ừ. Ôi trời ơi!\nGiỏi lắm, bạn tôi. Cậu làm tốt lắm. Thật chứ?\nTớ run suýt chết luôn! Vâng, chú? Vâng.","ko":"거기에 해물 크림 스파게티 나오는데 새우가 완전 통통한 거 있지\n(정예은 친구) 맛있겠다!\n아, 오늘 날씨 참 좋다. 응, 그러니까...\n아! 장하다, 내 친구 잘했어, 잘했어. 진짜?\n나 다리 후달거려 죽을 뻔했어. 네, 아저씨","en":"I saw that there. Shrimps looked fat!\nAh, the weather today is so nice! Yeah. Oh, my!\nGood job, friend! Really, good job. Really?\nI was so nervous! Yes, sir? No.","start":1876.830973,"end":1930.171864,"viStart":1845.045985,"viEnd":1877.290248,"koStart":1876.830973,"koEnd":1930.171864,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1845.045985,"end":1877.290248},"koRange":{"start":1876.830973,"end":1930.171864}},{"id":61,"sourceUid":"merged-mtu7n7xs-42","sourceNo":61,"originalSourceNo":425,"displayNo":61,"vi":"[âm thanh rung của điện thoại di động]\n[Âm nhạc nặng nề, yên tĩnh bắt đầu]","ko":"[핸드폰 진동 소리]\n[조용하고 무거운 음악 시작]","en":"[cell phone vibrating sound]\n[Quiet, heavy music starts]","start":1965.4,"end":1967.73,"viStart":1965.4,"viEnd":1967.73,"koStart":1965.4,"koEnd":1967.73,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":62,"sourceUid":"ko-mtlk8tad-1167","sourceNo":62,"originalSourceNo":426,"displayNo":62,"vi":"Em không vào lớp hả? Em có chút chuyện… Ừ.","ko":"강의 안 들어? 네. 일이 좀 있어서...그래","en":"You're not going to class?\nSomething came up, so...Okay.","start":1936.868046,"end":1951.50736,"viStart":1905.171667,"viEnd":1914.360964,"koStart":1936.868046,"koEnd":1951.50736,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1905.171667,"end":1914.360964},"koRange":{"start":1936.868046,"end":1951.50736}},{"id":63,"sourceUid":"merged-mtu8ib0g-44","sourceNo":63,"originalSourceNo":443,"displayNo":63,"vi":"Nóng thật. Cô biết tại sao con người có hai quả thận không?\nMột quả để thanh lọc cơ thể, một quả là để dự phòng.\nCô chỉ cần một thôi. Có chuyện gì vậy? Có thứ này gửi đến.\nGIẤY BÁO NHẬP NGŨ YOON SOO MYUNG\nMẹ không khai báo người tàn tật hả? Không. Tại sao?\nMẹ tưởng em con sẽ tỉnh… vào ngày mai hoặc ngày kia gì đó…\nMẹ tưởng em con sẽ tỉnh.\nMẹ đã nghĩ muộn cũng chắc tháng sau thôi. Trong tận sáu năm?\nCon hiểu. Chắc vì mẹ muốn tin như thế.\nKhông phải vì có thể tin, mà vì mẹ muốn tin.","ko":"(대부업자) 아휴, 덥다\n아주머니, 신장이 왜 두 개인 줄 알아요?\n(대부업자) 하나님이 하나는 정화시키라고...\n웬일이냐? 이런 게 왔어요.\n(윤진명) 장애 신청 안 했어요? 안 했어\n왜요? 깨어날 줄 알았으니까. 내일이나 모레쯤. 깨어날 줄 알았어\n늦어도 다음 달엔 깨어나겠지...6년 동안이나요? 이해해요\n믿고 싶었던 거겠죠. 믿을 수 있어서가 아니라. 믿고 싶어서","en":"It's hot. Do you know why people have two kidneys?\nOne for purifying your body and the other as a backup.\nSo you only need one. What brings you here? I got this mail.\nMILITARY DRAFT NOTICE SOO-MYUNG YOON\nDidn't you apply for disability benefits? No, I didn't. Why not?\nI thought he would wake up...in few days...I thought he'd wake up.\nI'm sure he'll wake up next month at least. It's been six years.\nI understand. You wanted to believe.\nNot because you had legitimate reasons, but because you wanted to.","start":1979.449587,"end":2085.505417,"viStart":1948.642143,"viEnd":2054.864728,"koStart":1979.449587,"koEnd":2085.505417,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1948.642143,"end":2054.864728},"koRange":{"start":1979.449587,"end":2085.505417}},{"id":64,"sourceUid":"merged-mtu8ln3t-45","sourceNo":64,"originalSourceNo":430,"displayNo":64,"vi":"[Âm nhạc nặng nề, yên tĩnh kết thúc]\n[Tiếng máy ‘bíp-bíp-bíp’ của bệnh viện]","ko":"[조용하고 무거운 음악 끝]\n[병원 '삡-삡-삡'하는 기계음 소리]","en":"[Quiet, heavy music ends]\n[Hospital ‘beep-beep-beep’ machine sound]","start":2084.44,"end":2085.41,"viStart":2084.44,"viEnd":2085.41,"koStart":2084.44,"koEnd":2085.41,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":65,"sourceUid":"merged-mtvm402e-1","sourceNo":65,"originalSourceNo":432,"displayNo":65,"vi":"Vì nếu không tin sẽ không thể chịu đựng được.\nNhưng mẹ biết không?\nHy vọng vốn dĩ là tai ương đấy.","ko":"(윤진명) 믿지 않으면 견딜 수 없었으니까\n근데 그거 알아요?\n희망은 원래 재앙이었다는 거","en":"And you couldn't bear it, if you didn't believe.\nBut did you know that?\nThat hope brings calamity?","start":2085.505417,"end":2102.578,"viStart":2054.864728,"viEnd":2068.016565,"koStart":2085.505417,"koEnd":2102.578,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2054.864728,"end":2068.016565},"koRange":{"start":2085.505417,"end":2102.578}},{"id":66,"sourceUid":"ko-mtlk8tad-1188","sourceNo":66,"originalSourceNo":447,"displayNo":66,"vi":"[Tiếng máy của bệnh viện kết thúc và yên lặng, tiếng nhạc nặng nề bắt đầu]","ko":"[병원 기계음 끝나면서 조용하고 무거운 음악 시작]","en":"[The hospital machine sounds end and quiet, heavy music begins]","start":2114.13,"end":2117.5,"viStart":2114.13,"viEnd":2117.5,"koStart":2114.13,"koEnd":2117.5,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":67,"sourceUid":"merged-mtvmhkbv-3","sourceNo":67,"originalSourceNo":449,"displayNo":67,"vi":"Jin Myung à!","ko":"진명아!\n(아이들) 막아!","en":"Jin-Myung!","start":2124.509691,"end":2130.361559,"viStart":2092.61,"viEnd":2097.551258,"koStart":2124.509691,"koEnd":2130.361559,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2092.61,"end":2097.551258},"koRange":{"start":2124.509691,"end":2130.361559}},{"id":68,"sourceUid":"merged-mtvn0qq0-5","sourceNo":68,"originalSourceNo":442,"displayNo":68,"vi":"Nhận bóng đi! Chuyền đi! Di chuyển!\nChạy! Hướng này! Dọn đường đi!\nChạy đi! Cậu ấy đã trở lại trạng thái ban đầu.","ko":"(아이들) 막어, 막어!\n(아이들) 저기다 패스해!\n(아이) 찬영아, 패스, 패스, 패스!\n(아이들) 막아! 막아야 돼!\n(의사) 원래 상태로 돌아왔습니다","en":"Get the ball! Pass it! Move, move!\nRun! This way! Clear the way!\nPass, pass it! Move!\nHe's back to where he used to be.","start":2155.93111,"end":2204.258151,"viStart":2097.551258,"viEnd":2174.782043,"koStart":2155.93111,"koEnd":2204.258151,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2097.551258,"end":2174.782043},"koRange":{"start":2155.93111,"end":2204.258151}},{"id":69,"sourceUid":"ko-mtlk8tad-1196","sourceNo":69,"originalSourceNo":455,"displayNo":69,"vi":"[cổ vũ]","ko":"[환호성]","en":"[cheering]","start":2223.33,"end":2225.06,"viStart":2223.33,"viEnd":2225.06,"koStart":2223.33,"koEnd":2225.06,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":70,"sourceUid":"merged-mtvnbkm9-7","sourceNo":70,"originalSourceNo":446,"displayNo":70,"vi":"Xin chào. Cô Jin Myung! Nay là thứ Năm mà.\nQuản lý ở đâu ạ? Ở nhà kho.\nÀ, chuyện rượu vang khi ấy…\nNghe nói là lỗi sổ sách. Cô chưa được nghe đúng không?\nBiết ngay mà. Tên khốn nạn.","ko":"안녕하세요? (조현희) 어! 진명 씨, 오늘 목요일인데\n매니저님은요? 창고에\n아, 그때 그 와인\n실수였대, 장부상의 실수 그런 얘기 못 들었지?\n그럴 줄 알았어, 나쁜 새끼","en":"Hello. Hey, Jin-Myung! Today's Thursday.\nWhere's the manager? He's in the storage.\nAbout that wine...\nIt was a mistake on his part. You didn't hear about that, right?\nI knew it. That evil bastard.","start":2230.418843,"end":2251.046,"viStart":2197.634585,"viEnd":2218.715401,"koStart":2230.418843,"koEnd":2251.046,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2197.634585,"end":2218.715401},"koRange":{"start":2230.418843,"end":2251.046}},{"id":71,"sourceUid":"merged-mtvngkun-10","sourceNo":71,"originalSourceNo":464,"displayNo":71,"vi":"Cô Jin Myung, bọn tôi đã thử nói chuyện…\nNếu cô muốn làm ra lẽ, bọn tôi sẽ giúp.\nAnh ta quá đáng hết lần này lần khác mà.\nLấy cớ kiểm tra đồng phục mà chạm chỗ này chỗ kia.\nLà quấy rối còn gì nữa? Cả chuyện tăng thời gian làm nữa.\nLần trước, anh ta còn gọi Sae Hee vào ngày nghỉ,\nrủ cô ấy đi ăn riêng nữa đấy.\nBọn tôi đã chịu đựng đến bây giờ.\nNhưng nếu lần này cô muốn làm cho ra lẽ, bọn tôi sẽ giúp…","ko":"진명 씨, 우리끼리 얘기해봤거든\n그거 진명 씨가 문제 삼는다고 하면 우리가 도와줄게\n아, 이번뿐만이 아니라 너무하잖아\n복장 검사한다고 배 찌르고 옆구리 찌르고\n그거 다 성희롱 아니야?\n알바 시간 슬금슬금 늘리는 것도 그렇고\n저번에 새희한테는 쉬는 날 나와 가지고\n(조현희) 자기랑 새로 생긴 레스토랑 가자 그랬대\n이제까지 꾹꾹 참았는데\n이번에 진명 씨가 그거\n문제 삼는다고 하면 우리들도 그냥 다같이...","en":"Jin-Myung, we were talking...\nand if you call him out, we'll help you.\nThis isn't the first time.\nHe touches us too much when he's checking our uniforms!\nIsn't that sexual harassment? And he keeps adding on our work times.\nAnd the other day, he called Sae-Hee out on her day off,\nand asked her to go to a new restaurant with him.\nWe've all been holding it in until now.\nIf you decide to call him out this time, all of us will...","start":2251.046,"end":2280.794378,"viStart":2218.715401,"viEnd":2249.928825,"koStart":2251.046,"koEnd":2280.794378,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2218.715401,"end":2249.928825},"koRange":{"start":2251.046,"end":2280.794378}},{"id":72,"sourceUid":"merged-mtvnk2aw-11","sourceNo":72,"originalSourceNo":466,"displayNo":72,"vi":"Tôi có chuyện muốn nói. À, về chuyện lần trước…\nTôi muốn nghỉ việc. Hả?\nPhiền anh thanh toán tiền lương tôi làm cho tới tuần trước.\nNếu cô nghỉ việc gấp thế thì bọn tôi…\nNhưng nếu cô thật sự cần thì… Được thôi.","ko":"드릴 말씀이 있습니다\n아, 그, 저기 지난번 그 일은...\n그만두겠습니다. 어?\n지난주까지 일한 알바비 계산해주셨으면 합니다\n아니 뭐 그렇게 갑자기 그만두면 우리가…\n뭐, 꼭 필요하다면 뭐, 할 수 없지, 뭐. 그래","en":"I have something to tell you.\nOh, about what happened last time... I'm quitting. What?\nPlease give me the money that's due to me for working.\nIf you quit so suddenly, we...\nWell, if you really need to, it should be...Yeah.","start":2292.160376,"end":2318.454072,"viStart":2259.369529,"viEnd":2286.438746,"koStart":2292.160376,"koEnd":2318.454072,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2259.369529,"end":2286.438746},"koRange":{"start":2292.160376,"end":2318.454072}},{"id":73,"sourceUid":"merged-mtvnp8bl-12","sourceNo":73,"originalSourceNo":481,"displayNo":73,"vi":"Sao em lại nghỉ việc?\nKhông phải anh bảo em nghỉ sao?\nKhi ấy… Em bảo đây giống như tận cùng mặt đất. \nTựa như đường giới hạn mà?\nĐúng vậy. Đây chính là giới hạn. \nNên em muốn nghỉ. Rồi sao nữa?","ko":"왜 그만둬요?\n(윤진명) 언제는 그만두라고 했잖아요?\n그때는...(박재완) 땅끝 같은 거라면서요?\n여기가 한계선이라면서요?\n맞아요 여기까지가 한계예요\n그래서 그만하려구요. 그만하면요?","en":"Why are you quitting?\nYou told me to quit, didn't you?\nBack then, I... You said this place was like\nthe ends of the earth for you.\nYou said this place was your limit.\nThat's right. This is my limit.\nThat's why I'm quitting. And then?","start":2324.961444,"end":2344.582188,"viStart":2286.438746,"viEnd":2313.700333,"koStart":2324.961444,"koEnd":2344.582188,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2286.438746,"end":2313.700333},"koRange":{"start":2324.961444,"end":2344.582188}},{"id":74,"sourceUid":"merged-mtvnu2yq-13","sourceNo":74,"originalSourceNo":474,"displayNo":74,"vi":"Ngày mai anh nghỉ nửa ngày được không?","ko":"내일 낮에 쉴 수 있어요?","en":"Can you get some time off tomorrow afternoon?","start":2350.671457,"end":2353.951,"viStart":2318.437022,"viEnd":2321.316388,"koStart":2350.671457,"koEnd":2353.951,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2318.437022,"end":2321.316388},"koRange":{"start":2350.671457,"end":2353.951}},{"id":75,"sourceUid":"ko-mtlk8tad-1229","sourceNo":75,"originalSourceNo":488,"displayNo":75,"vi":"[Bình tĩnh] \n[Tiếng bật bếp ga]","ko":"[담담하게] \n[가스레인지 켜는 소리]","en":"[Calmly] \n[Sound of gas stove being turned on]","start":2365.4,"end":2368.13,"viStart":2365.4,"viEnd":2368.13,"koStart":2365.4,"koEnd":2368.13,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":76,"sourceUid":"merged-mtvnvni7-14","sourceNo":76,"originalSourceNo":490,"displayNo":76,"vi":"Bác không phải là người vô ý thế đâu.\nBác biết vì bác mà mấy đứa khó chịu, mất ngủ lắm phải không? Bác xin lỗi.\nThay vào đó, bác sẽ nấu đồ ăn ngon nên mấy đứa ăn nhiều vào nhé!","ko":"나 그렇게 눈치 없는 사람 아니에요\n(유은재 엄마) 나 때문에 잠도 설치고, 불편하죠?\n(유은재 엄마) 미안해요\n그대신 내가 맛있는 거 많이 해줄 테니까 많이들 먹어요","en":"I am not tactless.\nYou couldn't sleep well and are uncomfortable because of me? I'm sorry.\nIn exchange, I'll cook you delicious food. Eat up!","start":2353.951,"end":2368.33,"viStart":2323.567182,"viEnd":2337.026048,"koStart":2353.951,"koEnd":2368.33,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2323.567182,"end":2337.026048},"koRange":{"start":2353.951,"end":2368.33}},{"id":77,"sourceUid":"merged-mtvo2b6d-17","sourceNo":77,"originalSourceNo":490,"displayNo":77,"vi":"Cháu bóc xong hành chưa? Nếu xong thì thái ra nhé! Vâng ạ.\nCháu thì chậm tay chậm chân quá. Còn phải làm sạch mực mà…\nÀ, còn cháu thì đang làm tốt lắm.\nEun Jae! Sao em về muộn thế? Con về rồi sao?\nNhanh nhanh… Chú vào đi. Jung Hee!\nĐi về nhà với anh thôi nào! Hứ! Sao anh lại đến đây?\nAnh đã sai rồi. Sai gì chứ? Sai tất.\nEm ghét anh. Ghét quá! Đồ ngốc! Để anh xem mặt em nào.\nEm khóc nhiều lắm hả? Ôi… Em xin lỗi. Ừ. Chắc em cần xin lỗi đấy.\nEm còn tưởng sẽ có thêm chuyện gì nữa. Ngưỡng mộ quá!","ko":"양파 다 깠어요? 깠으면 여기 채 썰구\n네 (유은재 엄마) 아우\n(유은재 엄마) 학생은 손이 너무 느리다\n(유은재 엄마) 오징어도 다듬어야 되는데\n아우, 학생은 잘하고 있네\n은재야! 왜 이제 와? (유은재 엄마) 왔어?\n너도 얼른... (유은재) 들어오세요. 정희 씨?\n그만 집에 갑시다. 흥! (유은재 엄마) 뭐하러 왔대? \n내가 잘못했어. 뭘 잘못했는데?\n다 잘못했어. 미워요. 미워\n(유은재 엄마) 바보. (새아빠) 어디, 얼굴 좀 봐요. 많이 울었어?\n죄송해요. 그래, 이건 좀 죄송하겠다\n뭔 일 나는 줄 알았네. 아, 부럽다!","en":"Are you done peeling the onions? If so, please chop them up.\nYes, ma'am. Oh, my, you're way too slow!\nYou have to work on the squid after that. You're doing well, though!\nEun Jae! Why are you back so late? You're back?\nHurry up, and... Please come in. Hi, Jung-Hee! Jung Hee!\nLet's go home now! Huh!\nWhy did you come here? I was wrong. What did you do wrong?\nEverything. I hate you. I hate you!\nYou're bad! Let me see your face. Did you cry a lot?\nPhew... I am sorry. Yeah. I bet you should be.\nMan, I thought some crazier\nevent would happen. Wow, I'm so jealous!","start":2368.33,"end":2466.094702,"viStart":2337.026048,"viEnd":2436.643539,"koStart":2368.33,"koEnd":2466.094702,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2337.026048,"end":2436.643539},"koRange":{"start":2368.33,"end":2466.094702}},{"id":78,"sourceUid":"merged-mtvo9xgu-18","sourceNo":78,"originalSourceNo":517,"displayNo":78,"vi":"[Với giọng ngáy]\n[Âm nhạc nhẹ nhàng và vui vẻ bắt đầu]\n[Kết thúc bản nhạc nhẹ nhàng vui tươi]\n[Với giọng ngáy]","ko":"[코맹맹이 소리로]\n[부드럽고 경쾌한 음악 시작]\n[부드럽고 경쾌한 음악 끝]\n[코맹맹이 소리로]","en":"[In a snoring voice]\n[Soft and cheerful music starts]\n[Soft and cheerful music ends]\n[In a snoring voice]","start":2486.16,"end":2487.8,"viStart":2486.16,"viEnd":2487.8,"koStart":2486.16,"koEnd":2487.8,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":79,"sourceUid":"merged-mtx1d3e8-1","sourceNo":79,"originalSourceNo":518,"displayNo":79,"vi":"Cả cái nhà hỗn loạn hết lên rồi! Đều là lỗi tại anh.\nKhông, việc miến trương lên đâu phải tại anh.\nĐồ ngốc! Đồ ngốc nghếch!\nEm tiễn bố mẹ xong rồi sao?\nEm xin lỗi. Sao? Lãng mạn mà. Cậu nói thật hả?","ko":"집안이 아주 난장판이 됐소\n다 니 잘못이에요. 아니오\n당면이 팅팅 불은 건 내 잘못이 아니오\n바보, 바보, 바보, 똥개\n부모님은 잘 보냈소?\n죄송해요. 왜? 로맨틱하던데\n그 말 진심이오?","en":"The entire house is a mess!\nIt's all your fault.\nNo, it's not my fault that noodles became mushy.\nIdiot! Idiot! Stupid! Idiot!\nDid you send your parents off well?\nI'm sorry. Why? It was romantic. Do you really mean that?","start":2478.95414,"end":2499.718403,"viStart":2436.643539,"viEnd":2467.407488,"koStart":2478.95414,"koEnd":2499.718403,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2436.643539,"end":2467.407488},"koRange":{"start":2478.95414,"end":2499.718403}},{"id":80,"sourceUid":"merged-mtx23obz-3","sourceNo":80,"originalSourceNo":535,"displayNo":80,"vi":"Ồ, ngon nhỉ. Ô, tiền bối Yoon về rồi hả?\nViệc làm thêm thì sao? Chị nghỉ một ngày.\nĐây là gì vậy? Nói ra thì dài lắm. Chị cứ đến đây ăn đi.\nCái gì vậy? Chả cá với bánh gạo cay.\nChị định mua về cùng ăn…\nKhông tin nổi. Chị là ai vậy? Có chuyện gì ạ?","ko":"(송지원) 맛있다.\n(정예은) [놀란 목소리로] 음, 윤 선배 왔어?\n(정예은) 알바는? (윤진명) 하루 빠지기로 했어.\n이게 다 뭐야?\n(송지원) 구구절절 사연이 많은데 일단 와서 잡솨\n그건 뭐야? 어묵이랑 떡볶이\n(윤진명) 같이 먹으려고 사왔는데\n말도 안 돼! 누구냐, 넌\n선배, 무슨 일 있어요?","en":"Wow, this is good.\nOh, Jin-Myung! You're back?\nDon't you have part-time job today? I took the day off.\nWhat's all this? It's a long story. Come and sit.\nWhat's that? Some fish cakes and spicy rice cakes.\nI bought some to eat together, but... No way. Who are you?\nDid something happen?","start":2511.746158,"end":2538.658825,"viStart":2480.309256,"viEnd":2506.874068,"koStart":2511.746158,"koEnd":2538.658825,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2480.309256,"end":2506.874068},"koRange":{"start":2511.746158,"end":2538.658825}},{"id":81,"sourceUid":"merged-mtx470yu-4","sourceNo":81,"originalSourceNo":547,"displayNo":81,"vi":"Chỉ là hình như dạo này tại chị mà mấy đứa không được thoải mái lắm. \nMất công mua rồi nhỉ. Ôi, không đâu chị!\nChị làm gì vậy? Bánh gạo cay này chỉ là bánh gạo cay sao?\nChả cá này chỉ là chả cá sao?\nLà đồ tiền bối Yoon mua cơ mà! Tiền bối Yoon đấy!\nChà! Gạt mấy cái kia đi! Biến đi! Tuyệt vời!\nMay quá. Dạo này thấy chị không được vui nên em rất lo lắng.\nThế mới nói. Bọn em thấy có lỗi đến chết luôn ấy!","ko":"그냥, 요즘 나 땜에 다들 눈치 보는 거 같애서. 괜히 사왔네. 어, 아니에요\n왜 이러세요? 이 떡볶이가 그냥 떡볶입니까?\n(송지원) 이 어묵은 그냥 어묵이 아니에요\n윤 선배가 사온 거란 말입니다 자그마치 윤 선배가...\n워, 저리 가! (송지원) 꺼져 버려!\n(송지원) 와, 대박!\n흠, 다행이다, 요새 윤 선배 기운 없어 보여서 걱정했는데\n그러니까요 미안해 죽는 줄 알았어요","en":"Well, I felt that I made you all uncomfortable nowadays.\nI guess I shouldn't bring them. Whoa, whoa, no!\nWhat are you doing? This rice cake isn't just ordinary rice cake!\nAnd these fish cakes aren't just regular fish cakes, either!\nThese are what Jin-Myung bought! Yes, that's right! Jin-Myung did!\nWow! Move that aside!\nForget about them!\nWow! I am relieved. I was worried because you seemed down these days.\nYeah. I felt so sorry!","start":2538.658825,"end":2568.153965,"viStart":2506.874068,"viEnd":2537.513098,"koStart":2538.658825,"koEnd":2568.153965,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2506.874068,"end":2537.513098},"koRange":{"start":2538.658825,"end":2568.153965}},{"id":82,"sourceUid":"merged-mtx4cz8n-5","sourceNo":82,"originalSourceNo":538,"displayNo":82,"vi":"Sao mấy đứa phải vậy?\nBọn em đã làm quá lên mà. Làm chị đi tàu bay giấy.\nTại bọn em mà chị lại kỳ vọng nhiều hơn.\nKhông phải lỗi mấy đứa đâu.\nChỉ là chị muốn tin nên mới tin thôi.\nVì nếu không tin thì sẽ không chịu được.","ko":"니들이 왜?\n우리가 뽐뿌질을 했잖어 바람을 괜히 많이 집어넣어 갖고\n네, 윤 선배도 더 기대했을 테구\n(윤진명) 니들 때문이 아니야\n난 그냥 믿고 싶어서 믿은 거야\n믿지 않으면 견딜 수가 없어서","en":"Why would you?\nWe helped you to get high expectation!\nYes. I'm sure you had even higher hopes than we did, too.\nIt's not your fault.\nI just believed I got the job, because I wanted to believe.\nI wouldn't be able to bear it otherwise.","start":2568.153965,"end":2589.721138,"viStart":2537.513098,"viEnd":2557.148096,"koStart":2568.153965,"koEnd":2589.721138,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2537.513098,"end":2557.148096},"koRange":{"start":2568.153965,"end":2589.721138}},{"id":83,"sourceUid":"merged-mtx4vhwx-10","sourceNo":83,"originalSourceNo":539,"displayNo":83,"vi":"Nào, bọn mình uống bia đi! Có bia mua sẵn đúng không?\nVâng! Nào, vì sự hồi sinh của tiền bối Yoon!\nCạn! Cạn! Được tiền bối Yoon mua đồ ăn quả là chuyện hiếm thấy.\nGiờ thì chỉ còn chờ thống nhất Bắc Hàn nữa là xong.","ko":"자, 우리 한잔합시다 맥주 사다 놓은 거 있지?\n얍! 자, 부활의 윤 선배!\n퐈이야! (다같이) 퐈이야!\n내 생전에 윤 선배 한턱을 받아 보다니\n(송지원) 크윽, 이제 남북통일만 이뤄지면 되는 건가?","en":"All right, let's all have a drink! We have beer, right?\nYep! For Jin-Myung, who has risen! Yeah!\nCheers! Cheers! Wow, I can't believe that I'm treated by Jin-Myung!\nNow my only wish is the reunification of Korea!","start":2589.721138,"end":2626.052,"viStart":2561.568,"viEnd":2596.27378,"koStart":2589.721138,"koEnd":2626.052,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2561.568,"end":2596.27378},"koRange":{"start":2589.721138,"end":2626.052}},{"id":84,"sourceUid":"merged-mtx4x2i2-15","sourceNo":84,"originalSourceNo":568,"displayNo":84,"vi":"[Kết thúc bản nhạc nhẹ nhàng vui tươi]\n[Tiếng cười và tiếng nói]\n[Âm nhạc thông báo bầu không khí kỳ lạ]\n[Âm thanh ù tai của 'Thứ ba']\n[Âm thanh ngạc nhiên]\n[Nhạc kết thúc báo hiệu một bầu không khí kỳ lạ]","ko":"[부드럽고 경쾌한 음악 끝]\n[웃고 떠드는 소리]\n[이상한 분위기를 알리는 음악]\n['띠'하는 이명 소리]\n[놀라는 소리]\n[이상한 분위기를 알리는 음악 끝]","en":"[Soft and cheerful music ends]\n[Sound of laughing and talking]\n[Music announcing a strange atmosphere]\n[Tinnitus sound of ‘Third’]\n[Sound of surprise]\n[Music ends signaling a strange atmosphere]","start":2626.052,"end":2732.019867,"viStart":2626.052,"viEnd":2732.019867,"koStart":2626.052,"koEnd":2732.019867,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":2626.052,"end":2732.019867}},{"id":85,"sourceUid":"merged-mtx50ea7-19","sourceNo":85,"originalSourceNo":551,"displayNo":85,"vi":"Nhanh đến đi! Nhanh lên! Nhanh đến đây!\nĐến đây đi! Đi nào! Gì vậy chứ? Chị xin lỗi.\nEm còn tưởng là ma. Chị không ngủ mà làm gì vậy?\nChị có vài thứ phải suy nghĩ.\nMay là mình còn gan dạ.\nCon ma ở đây mà em nói đến ấy…","ko":"빨리 와요, 언니\n(정예은) 이리 와, 얼른, 가자\n뭐야, 이게? (윤진명) 미안. 귀신인 줄 알았잖아\n(송지원) 잠 안 자고 뭐해? 뭣 좀 생각하느라고\n담대한 나이기 망정이지\n(윤진명) 여기 있다는 귀신 말이야","en":"Hurry over here! Hurry! Let's go!\nCome here! Hurry! Let's go!\nWhat is this? Sorry.\nOh, I thought you were a ghost!\nWhat are you doing? I was just thinking about few things.\nOh, man. You scared me. About the ghost that you said was here...","start":2732.019867,"end":2785.128613,"viStart":2698.063,"viEnd":2753.4131,"koStart":2732.019867,"koEnd":2785.128613,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2698.063,"end":2753.4131},"koRange":{"start":2732.019867,"end":2785.128613}},{"id":86,"sourceUid":"merged-mtxoth5i-3","sourceNo":86,"originalSourceNo":559,"displayNo":86,"vi":"Là em chị đấy.\nEm ấy trong sáu năm qua không sống cũng không chết.\nKhông thể động đậy.\nĐiều này hẳn là rất kinh khủng. Đúng không?","ko":"내 동생이야\n(윤진명) 6년 동안 죽지도 못하고 살지도 못하고\n(윤진명) 꼼짝도 못 하고\n그건 진짜 끔찍할 거야. 그치?","en":"It's my little brother.\nHe hasn't been able to live or die for last six years.\nHe can't even move.\nThat must be really terrible. Right?","start":2785.128613,"end":2811.304862,"viStart":2753.4131,"viEnd":2775.161667,"koStart":2785.128613,"koEnd":2811.304862,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2753.4131,"end":2775.161667},"koRange":{"start":2785.128613,"end":2811.304862}},{"id":87,"sourceUid":"merged-mtxos17a-2","sourceNo":87,"originalSourceNo":581,"displayNo":87,"vi":"[Đáng lo ngại, âm nhạc đen tối bắt đầu]\n[Âm nhạc lo lắng và đen tối kết thúc]","ko":"[불안하고 어두운 음악 시작]\n[불안하고 어두운 음악 끝]","en":"[Unsettling, dark music starts]\n[Anxious and dark music ends]","start":2830.86,"end":2832.86,"viStart":2830.86,"viEnd":2832.86,"koStart":2830.86,"koEnd":2832.86,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":88,"sourceUid":"merged-mtxpsbyp-6","sourceNo":88,"originalSourceNo":570,"displayNo":88,"vi":"Ôi, giật cả mình… Lại chuyện gì?\nHãy nói là không phải lỗi tại tôi đi.\nLà lỗi tại cậu đấy, dù không biết là chuyện gì.\nViệc ngày hôm nay nóng cũng là lỗi tại cậu đấy.\nKhông đâu. Mỗi người đều có một con ma mà họ muốn thấy.\nHọ sống trong khi ôm một con ma trong lòng đấy!\nNày! Tiền bối Yoon rất kỳ lạ. Con ma ở đây mà em nói đến ấy…\nLà em chị đấy.","ko":"아이, 깜짝아, 진짜\n뭐 또? 내 잘못이 아니라고 말해줘\n니 잘못이야. 뭔진 모르지만 다 니 잘못이야\n오늘 날 더운 것도. 다 니 잘못이야\n아니야, 아니야, 아니야. 다들 보고 싶은 귀신이 있었던 거야\n다들 가슴속에 귀신 하나쯤 품고 살았던 거라구\n(임성민) 야! 윤 선배 이상해. (윤진명) 여기 있다는 귀신 말이야","en":"Oh, my... What is it now?\nTell me that it's not my fault.\nIt's all your fault. I don't know what it is.\nIt is all your fault that today is so hot.\nNo, no, no. They all just had ghosts that they want to see.\nThey all had ghost in their hearts!\nHey! Jin-Myung is acting weird. About the ghost that you said was here...\nIt's my little brother.","start":2824.246,"end":2847.27976,"viStart":2775.161667,"viEnd":2817.893954,"koStart":2824.246,"koEnd":2847.27976,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2775.161667,"end":2817.893954},"koRange":{"start":2824.246,"end":2847.27976}},{"id":90,"sourceUid":"merged-mtxqzwxr-7","sourceNo":90,"originalSourceNo":591,"displayNo":90,"vi":"Chị ấy không ngủ suốt cả đêm.\nNày cậu bỏ ra rồi nói!\nEm ấy trong sáu năm qua không sống cũng không chết.\nKhông thể động đậy.\nSáu năm qua không có vấn đề gì mà sao tự nhiên lại vậy?\nQuý khách số 27 vui lòng đến quầy 3.\nMột tháng nữa là hết hạn, mà giờ quý khách muốn rút hết ra sao? Vâng.","ko":"내 동생이야\n한밤중에 잠 안 자고\n야, 임마. 이거 좀 놓고 얘기해\n6년 동안. 죽지도 못하고 살지도 못하고\n꼼짝도 못 하고\n6년 동안 그랬으면그런 거지, 왜 갑자기?\n27번 고객님 3번 창구로 오십시오\n(은행원) 한 달 있으면 만긴데 지금 해약하시게요? 네","en":"She was up in the middle of the night.\nLet me go and talk!\nHe hasn't been able to live or die for last six years.\nAnd he can't even move at all.\nOkay, so he was like that for six years. Why is she bringing that up now?\nNumber 27 at Window 3.\nYour account matures next month. Are you sure you want to close it down? Yes.","start":2847.27976,"end":2882.687288,"viStart":2817.894,"viEnd":2850.674756,"koStart":2847.27976,"koEnd":2882.687288,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2817.894,"end":2850.674756},"koRange":{"start":2847.27976,"end":2882.687288}},{"id":91,"sourceUid":"ko-mtlk8tad-1341","sourceNo":91,"originalSourceNo":600,"displayNo":91,"vi":"[tiếng máy] [tiếng cười]","ko":"[기계음] [웃음소리]","en":"[machine sound] [laughter sound]","start":2894.26,"end":2897,"viStart":2894.26,"viEnd":2897,"koStart":2894.26,"koEnd":2897,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":92,"sourceUid"
